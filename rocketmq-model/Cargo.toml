[package]
name = "rocketmq-model"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
description = "Runtime-neutral RocketMQ domain models"
rust-version.workspace = true

[features]
default = []
simd = ["dep:simd-json"]

[dependencies]
base64 = "0.23.0"
byteorder = "1.5.0"
bytes.workspace = true
cheetah-string.workspace = true
chrono = "0.4.45"
crc = "3.4.0"
dashmap.workspace = true
flate2 = { version = "1.1.9", features = ["zlib"], default-features = false }
local-ip-address = "0.6.13"
lz4_flex = { version = "0.14", features = ["alloc"], default-features = false }
rocketmq-error.workspace = true
serde.workspace = true
serde_json.workspace = true
simd-json = { version = "0.18.1", optional = true }
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
zstd = "0.13"
md-5 = "0.11"
