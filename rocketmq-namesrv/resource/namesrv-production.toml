# RocketMQ Name Server Configuration File (TOML Format)
# Production baseline: a starting point for a production deployment, with
# thread-pool and queue sizes raised above the built-in defaults to handle
# higher broker/client concurrency. Review every value against your own
# capacity plan before deploying - see namesrv-example.toml for the full
# list of available keys.

# RocketMQ installation directory.
# Default: $ROCKETMQ_HOME / $ROCKETMQ_HOME_PROPERTY env var, or empty.
# Point at a real, durable install path in production.
rocketmqHome = "/opt/rocketmq"

# Key-Value configuration file path.
# Default: ~/rocketmq-namesrv/kvConfig.json
kvConfigPath = "/opt/rocketmq/data/kvConfig.json"

# Configuration persistence file path.
# Default: ~/rocketmq-namesrv/rocketmq-namesrv.properties
configStorePath = "/opt/rocketmq/data/rocketmq-namesrv.properties"

# A public listener must never rely on the migration-only insecure override.
allowInsecurePublicListener = false

# The secure-enforced process profile additionally requires an enforcing TLS
# listener and the ROCKETMQ_SECURITY_* bootstrap material. Keep the ACL and
# metadata paths on durable, access-controlled storage.
authenticationEnabled = true
authorizationEnabled = true
authConfigPath = "/opt/rocketmq/data/auth"
aclFile = "/opt/rocketmq/conf/plain_acl.yml"

# Rust semantic route-read concurrent permits. The Java-compatible property
# name is retained, but this does not create OS threads in the Tokio runtime.
# Default: 8. Suggested range: 16-32 after measuring route p99 and CPU.
clientRequestThreadPoolNums = 16

# Total broker-control + admin permits. Rust reserves a quarter for admin so a
# registration storm cannot starve authenticated operational requests.
# Default: 16. Suggested range: 32-64 after measuring registration bursts.
defaultThreadPoolNums = 32

# Maximum route-read waiters. Prefer a bounded deadline and fast SystemBusy
# response over continually raising this limit under sustained overload.
clientRequestThreadPoolQueueCapacity = 100000

# Total broker-control + admin waiting budget.
defaultThreadPoolQueueCapacity = 20000

# Start in observe-only mode, then set observe-only=false after validating
# class mapping, reject rate, and route p99. Both switches are live; permit,
# queue, and timeout sizing changes require restart.
namesrvWorkloadAdmissionEnable = true
namesrvWorkloadAdmissionObserveOnly = true
namesrvWorkloadAdmissionTimeoutMillis = 100

# Sample one route freshness lookup per 1000 successful route reads. Disabled
# telemetry performs no live-table lookup.
routeFreshnessSampleInterval = 1000

# Typed zone filtering and response cache have independent rollback switches.
# Enable typed zone filtering in shadow first. Keep the cache disabled until
# registration generation churn and RSS are proven within budget.
namesrvTypedZoneRouteEnable = false
namesrvTypedZoneRouteShadow = false
namesrvRouteResponseCacheEnable = false
namesrvRouteResponseCacheMaxBytes = 67108864
namesrvRouteResponseCacheMaxEntries = 10000
namesrvRouteResponseCacheMaxSingleResponseBytes = 1048576
namesrvRouteResponseCacheShards = 16

# Unregister broker queue capacity.
# Default: 3000. Raise alongside cluster size / broker churn rate.
unRegisterBrokerQueueCapacity = 5000

# Registration delta publication is restart-scoped. Keep false for the first
# canary, then enable after no-op/changed counters and Java mixed-version route
# digests remain aligned.
enableRegistrationDelta = false

# Bound each unregister mutation slice by both count and collection time. Queue
# saturation falls back to one synchronous fenced cleanup rather than dropping
# route removal.
unRegisterBrokerBatchSize = 100
unRegisterBrokerBatchTimeMillis = 2

# Expiry-index rollout: off -> shadow -> active. Shadow keeps the full scan as
# authority and reports divergence; active uses deadline lookup plus a five
# minute safety reconciliation.
expiryIndexMode = "shadow"
expirySafetyScanInterval = 300000

# Bound and coalesce minimum-broker notifications during broker churn.
minBrokerNotifyConcurrency = 8
