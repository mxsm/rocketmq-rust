[workspace]
resolver = "2"

[package]
name = "rocketmq-mcp"
version = "1.0.0"
authors = ["mxsm <mxsm@apache.org>"]
edition = "2021"
homepage = "https://github.com/mxsm/rocketmq-rust"
repository = "https://github.com/mxsm/rocketmq-rust"
license = "Apache-2.0"
keywords = ["rocketmq", "mcp", "ai", "sre", "agent"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
description = "Feature-composed entrypoint for RocketMQ query and control MCP servers"
rust-version = "1.95.0"

[features]
default = ["read-only", "diagnose", "stdio"]
query = ["dep:rocketmq-mcp-query", "rocketmq-mcp-query/read-only"]
read-only = ["query"]
diagnose = ["query", "rocketmq-mcp-query/diagnose"]
stdio = ["query", "rocketmq-mcp-query/stdio"]
auth = ["dep:rocketmq-mcp-auth"]
streamable-http = ["query", "auth", "rocketmq-mcp-query/streamable-http"]
control = ["auth", "dep:rocketmq-mcp-control"]
write-tools = ["control", "rocketmq-mcp-control/write-tools"]
observability = ["rocketmq-mcp-query?/observability"]
otlp = ["observability", "rocketmq-mcp-query?/otlp", "rocketmq-mcp-control?/otlp"]
change-planning = ["query", "rocketmq-mcp-query/change-planning"]
security-admin = ["query", "rocketmq-mcp-query/security-admin"]

[dependencies]
rocketmq-mcp-query = { version = "1.0.0", path = "../rocketmq-mcp-query", default-features = false, optional = true }
rocketmq-mcp-auth = { version = "1.0.0", path = "../rocketmq-mcp-auth", default-features = false, optional = true }
rocketmq-mcp-control = { version = "1.0.0", path = "../rocketmq-mcp-control", default-features = false, optional = true }
thiserror = "2.0.18"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27.0"

[[bin]]
name = "rocketmq-mcp"
path = "src/main.rs"
