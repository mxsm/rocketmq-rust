syntax = "proto3";

package rocketmq.sre.provider.v1;

// The transport must use mutual TLS. Canonical request/response payloads are
// versioned JSON so the SPI can evolve independently from generated Rust DTOs.
service ProviderAdapter {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc InvokeStream(InvokeRequest) returns (stream StreamEvent);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HandshakeRequest {
  string wire_version = 1;
  string gateway_identity = 2;
  string correlation_id = 3;
  uint64 max_payload_bytes = 4;
}

message HandshakeResponse {
  string wire_version = 1;
  string adapter_identity = 2;
  string credential_owner = 3; // Must be "adapter".
  bytes capabilities_json = 4;
  string credential_version_fingerprint = 5;
}

message InvokeRequest {
  string invocation_id = 1;
  string correlation_id = 2;
  uint64 deadline_unix_ms = 3;
  bytes canonical_request_json = 4;
  uint64 stream_channel_capacity = 5;
  uint64 max_stream_events = 6;
  uint64 max_stream_bytes = 7;
}

message InvokeResponse {
  bytes canonical_response_json = 1;
  ProviderError error = 2;
}

message StreamEvent {
  bytes canonical_event_json = 1;
  ProviderError error = 2;
}

message CancelRequest {
  string invocation_id = 1;
  string correlation_id = 2;
}

message CancelResponse {}
message HealthRequest {}

message HealthResponse {
  string status = 1;
  string credential_version_fingerprint = 2;
}

message ProviderError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}
