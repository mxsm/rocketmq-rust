schema_version: rocketmq-sre.autonomy-action-policy.v1
action_id: proxy.scale_out_one.v1
action_version: 1.0.0
default_mode: disabled
owner: messaging-platform
diagnostic_pack:
  id: proxy-capacity
  version: 1.0.0
required_evidence_sources:
  - kubernetes_inventory
  - prometheus
minimum_evidence_freshness_seconds: 60
qualification:
  min_shadow_samples: 20
  min_supervised_successes: 5
  observation_window_days: 7
limits:
  max_executions_per_hour: 1
  cooldown_seconds: 1800
  max_concurrent_executions: 1
  stable_window_seconds: 600
autonomous_preconditions:
  - deployment_generation_unchanged
  - replicas_below_allowlisted_maximum
  - pod_disruption_budget_healthy
  - error_budget_available
rollback:
  required: true
  verification: original_replica_count_restored
