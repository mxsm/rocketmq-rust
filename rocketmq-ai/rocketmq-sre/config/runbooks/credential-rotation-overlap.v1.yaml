schema_version: rocketmq-sre.runbook-definition.v1
id: 10000000-0000-4000-8000-000000000003
name: credential-rotation-overlap
version: 1.0.0
owner: messaging-security
description: Add a referenced candidate credential, preserve overlap, and validate it with a dedicated synthetic topic.
risk: r2
max_parallelism: 1
steps:
  - id: 13000000-0000-4000-8000-000000000001
    sequence: 1
    name: activate candidate credential with overlap
    depends_on: []
    parallel_group: null
    condition: null
    body:
      kind: action
      action: security.credential_rotate_overlap.v1
      descriptor_version: 1.0.0
      resource: credential-set/broker-api
      parameters:
        credential_set: broker-api
        active_version: v1
        candidate_version: v2
        candidate_secret_ref: vault://rocketmq/broker-api/v2
        overlap_seconds: 600
        validation_probe_topic: SRE_PROBE_CREDENTIAL_ROTATION
  - id: 13000000-0000-4000-8000-000000000002
    sequence: 2
    name: verify credential overlap
    depends_on:
      - 13000000-0000-4000-8000-000000000001
    parallel_group: null
    condition:
      fact: credential.candidate.probe_success
      operator: equals
      expected: true
    body:
      kind: manual_gate
      gate:
        gate_id: verify-credential-overlap
        title: Verify credential overlap
        instructions: Confirm both versions remain valid, the dedicated probe succeeds, and authentication errors remain within SLO.
        required_role: approver
        timeout_seconds: 1800
compensation_edges:
  - from_step: 13000000-0000-4000-8000-000000000001
    compensation_step: 13000000-0000-4000-8000-000000000002
    trigger: verification_failed
  - from_step: 13000000-0000-4000-8000-000000000001
    compensation_step: 13000000-0000-4000-8000-000000000002
    trigger: cancel_after_intent
created_at: 2026-01-01T00:00:00Z
