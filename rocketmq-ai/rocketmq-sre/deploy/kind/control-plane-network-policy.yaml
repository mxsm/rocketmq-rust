apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sre-control-plane-ingress
  namespace: rocketmq-sre
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rocketmq-sre-control-plane
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rocketmq-sre
      ports:
        - {protocol: TCP, port: 8090}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rocketmq-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rocketmq-sre-phase00-smoke
      ports:
        - {protocol: TCP, port: 8090}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rocketmq-system
          podSelector:
            matchLabels:
              rocketmqrust.com/sre-connector: "true"
      ports:
        - {protocol: TCP, port: 8444}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sre-model-mock-isolation
  namespace: rocketmq-sre
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rocketmq-sre-model-mock
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rocketmq-sre-control-plane
      ports:
        - {protocol: TCP, port: 8094}
  egress: []
