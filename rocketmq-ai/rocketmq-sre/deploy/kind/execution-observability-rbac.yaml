apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-execution-agent-collector-restart
  namespace: observability
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["otel-collector"]
    verbs: ["get", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-execution-agent-collector-restart
  namespace: observability
subjects:
  - kind: ServiceAccount
    name: sre-execution-agent
    namespace: rocketmq-sre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-execution-agent-collector-restart
