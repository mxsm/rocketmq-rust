worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout combined;
    server_tokens off;
    map_hash_bucket_size 128;

    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map "$ssl_client_s_dn|$ssl_client_i_dn" $connector_identity_allowed {
        default 0;
        "CN=rocketmq-sre-connector|CN=RocketMQ SRE Connector Development CA" 1;
    }

    server {
        listen 8444 ssl;
        http2 on;

        ssl_certificate /etc/rocketmq/sre-channel/control-plane-server-cert.pem;
        ssl_certificate_key /etc/rocketmq/sre-channel/control-plane-server-key.pem;
        ssl_client_certificate /etc/rocketmq/sre-channel/connector-client-ca-cert.pem;
        ssl_verify_client on;
        ssl_verify_depth 1;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        ssl_session_cache shared:SREConnectorChannel:1m;
        ssl_session_timeout 10m;

        client_max_body_size 640k;
        client_body_buffer_size 640k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 30s;
        send_timeout 10s;

        location ^~ /internal/v1/connectors/v1/ {
            if ($connector_identity_allowed = 0) {
                return 403;
            }

            limit_except GET POST {
                deny all;
            }

            proxy_pass http://127.0.0.1:8093;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 70s;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_redirect off;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_set_header Host sre-control-plane;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-RocketMQ-Connector-Subject $ssl_client_s_dn;
            proxy_set_header X-RocketMQ-Connector-Issuer $ssl_client_i_dn;
        }

        location / {
            return 404;
        }
    }
}
