services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    profiles: ["enterprise"]
    command: ["start-dev", "--import-realm", "--proxy-headers=xforwarded", "--hostname-strict=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: qualification-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: qualification-only
    volumes:
      - ./enterprise-realm.json:/opt/keycloak/data/import/rocketmq-sre-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [rocketmq-sre, control-plane-backend]

  keycloak-tls:
    image: nginx:1.29-alpine
    profiles: ["enterprise"]
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./enterprise-keycloak-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../../target/phase00-certs/server-cert.pem:/etc/rocketmq/tls/server-cert.pem:ro
      - ../../../../target/phase00-certs/server-key.pem:/etc/rocketmq/tls/server-key.pem:ro
    ports:
      - "8445:8445"
    networks: [rocketmq-sre, control-plane-backend]

  vault:
    image: hashicorp/vault:1.20.4
    profiles: ["enterprise"]
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: qualification-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "8200:8200"
    networks: [rocketmq-sre, control-plane-backend]

  vault-render:
    image: hashicorp/vault:1.20.4
    profiles: ["enterprise"]
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: qualification-root-token
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        vault kv put secret/rocketmq-sre/object-store \
          access_key=rocketmq-sre-qualification \
          secret_key=rocketmq-sre-qualification-secret
        install -d -m 0700 /rendered/object-store
        umask 077
        vault kv get -field=access_key secret/rocketmq-sre/object-store > /rendered/object-store/access-key
        vault kv get -field=secret_key secret/rocketmq-sre/object-store > /rendered/object-store/secret-key
    volumes:
      - ../../../../target/enterprise-secrets:/rendered
    restart: "no"
    networks: [control-plane-backend]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["enterprise"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rocketmq-sre-qualification
      MINIO_ROOT_PASSWORD: rocketmq-sre-qualification-secret
    volumes:
      - enterprise-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [control-plane-backend]

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["enterprise"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set qualification http://minio:9000 rocketmq-sre-qualification rocketmq-sre-qualification-secret
        mc mb --ignore-existing qualification/rocketmq-sre-evidence
        mc anonymous set none qualification/rocketmq-sre-evidence
    restart: "no"
    networks: [control-plane-backend]

  minio-tls:
    image: nginx:1.29-alpine
    profiles: ["enterprise"]
    depends_on:
      minio-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./enterprise-minio-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../../target/phase00-certs/server-cert.pem:/etc/rocketmq/tls/server-cert.pem:ro
      - ../../../../target/phase00-certs/server-key.pem:/etc/rocketmq/tls/server-key.pem:ro
    ports:
      - "9443:9443"
    networks: [rocketmq-sre, control-plane-backend]

  sre-control-plane:
    depends_on:
      keycloak-tls:
        condition: service_started
      vault-render:
        condition: service_completed_successfully
      minio-tls:
        condition: service_started
    environment:
      ROCKETMQ_SRE_DEV_AUTH: "false"
      ROCKETMQ_SRE_OIDC_ISSUER: https://localhost:8445/realms/rocketmq-sre
      ROCKETMQ_SRE_OIDC_AUDIENCE: rocketmq-sre-control-plane
      ROCKETMQ_SRE_OIDC_JWKS_URL: https://keycloak-tls:8445/realms/rocketmq-sre/protocol/openid-connect/certs
      ROCKETMQ_SRE_OIDC_CA_PATH: /etc/rocketmq/tls/ca-cert.pem
      ROCKETMQ_SRE_OBJECT_STORE_LOCAL_PATH: null
      ROCKETMQ_SRE_OBJECT_STORE_ENDPOINT: https://minio-tls:9443
      ROCKETMQ_SRE_OBJECT_STORE_BUCKET: rocketmq-sre-evidence
      ROCKETMQ_SRE_OBJECT_STORE_REGION: us-east-1
      ROCKETMQ_SRE_OBJECT_STORE_CA_PATH: /etc/rocketmq/tls/ca-cert.pem
      ROCKETMQ_SRE_OBJECT_STORE_VAULT_AGENT_ROOT: /run/secrets/rocketmq-sre
      ROCKETMQ_SRE_OBJECT_STORE_SECRET_NAMESPACE: object-store
      ROCKETMQ_SRE_OBJECT_STORE_ACCESS_KEY_REF: external://object-store/access-key
      ROCKETMQ_SRE_OBJECT_STORE_SECRET_KEY_REF: external://object-store/secret-key
      ROCKETMQ_SRE_OBJECT_STORE_SECRET_CACHE_SECONDS: "5"
    volumes:
      - ../../../../target/phase00-certs/ca-cert.pem:/etc/rocketmq/tls/ca-cert.pem:ro
      - ../../../../target/enterprise-secrets:/run/secrets/rocketmq-sre:ro

  sre-ui:
    build:
      args:
        VITE_SRE_AUTH_MODE: oidc
        VITE_SRE_OIDC_AUTHORITY: https://localhost:8445/realms/rocketmq-sre
        VITE_SRE_OIDC_CLIENT_ID: rocketmq-sre-ui
        VITE_SRE_OIDC_REDIRECT_URI: http://localhost:3004/auth/callback
        VITE_SRE_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:3004
        VITE_SRE_OIDC_SCOPE: "openid profile rocketmq:read rocketmq:diagnose rocketmq:model-governance"

volumes:
  enterprise-minio-data:
