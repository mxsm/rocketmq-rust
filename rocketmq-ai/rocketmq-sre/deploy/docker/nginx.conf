server {
    listen 3004;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass http://sre-control-plane:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://sre-control-plane:8090/healthz;
    }

    location = /readyz {
        proxy_pass http://sre-control-plane:8090/readyz;
    }

    location / {
        try_files $uri /index.html;
    }
}
