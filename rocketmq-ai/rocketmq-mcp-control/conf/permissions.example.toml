# Configure these as closed OAuth claims at the identity provider. They do not grant access by themselves;
# the server intersects them with its own allowlists and always requires rocketmq:write.
scope = ["rocketmq:write"]
rocketmq_operations = [
  "topic_upsert",
  "consumer_group_upsert",
  "consumer_offset_reset",
  "broker_config_patch",
  "consumer_request_mode",
  "proxy_drain_begin",
  "proxy_drain_cancel",
  "broker_log_filter_set",
  "broker_log_filter_restore",
]
rocketmq_clusters = ["production-a"]
