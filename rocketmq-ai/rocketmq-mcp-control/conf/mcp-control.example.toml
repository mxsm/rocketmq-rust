[server]
bind = "127.0.0.1:8090"
endpoint = "/mcp"
public_base_url = "https://control.example.test"

[server.tls]
cert_path = "secrets/control-cert.pem"
key_path = "secrets/control-key.pem"

[oauth]
issuer = "https://identity.example.test"
audience = "rocketmq-mcp-control"
jwks_url = "https://identity.example.test/.well-known/jwks.json"

[mutations]
mutations_enabled = false
dry_run = true
# Closed values: topic_upsert, consumer_group_upsert, consumer_offset_reset, broker_config_patch,
# consumer_request_mode. Keep the allowlist empty until the matching OAuth claims and cluster are ready.
allowed_operations = []
allowed_clusters = []
operation_timeout_seconds = 24

# A private logical cluster registry is required before any reviewed operation can be allowlisted.
# Credential values are read from these environment variables only when a session is opened.
[[clusters]]
name = "production-a"
namesrv_addr = "nameserver.example.test:9876"
use_tls = true
access_key_env = "ROCKETMQ_CONTROL_ACCESS_KEY"
secret_key_env = "ROCKETMQ_CONTROL_SECRET_KEY"
# security_token_env = "ROCKETMQ_CONTROL_SECURITY_TOKEN"

[audit]
path = "var/audit/rocketmq-mcp-control.jsonl"
capacity = 4096
max_record_bytes = 4096
