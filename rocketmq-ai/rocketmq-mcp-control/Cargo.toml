[workspace]
resolver = "2"

[package]
name = "rocketmq-mcp-control"
version = "1.0.0"
authors = ["mxsm <mxsm@apache.org>"]
edition = "2021"
homepage = "https://github.com/mxsm/rocketmq-rust"
repository = "https://github.com/mxsm/rocketmq-rust"
license = "Apache-2.0"
keywords = ["rocketmq", "mcp", "control", "oauth"]
categories = ["development-tools"]
readme = "README.md"
description = "Isolated deny-by-default RocketMQ MCP control foundation"
rust-version = "1.95.0"

[features]
default = []
write-tools = ["dep:rocketmq-admin-core"]

[dependencies]
rocketmq-runtime = { version = "1.0.0", path = "../../rocketmq-runtime" }
rocketmq-transport = { version = "1.0.0", path = "../../rocketmq-transport", default-features = false, features = ["tls"] }
rocketmq-admin-core = { version = "1.0.0", path = "../../rocketmq-tools/rocketmq-admin/rocketmq-admin-core", default-features = false, features = ["mutation-client-adapter"], optional = true }

axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
jsonwebtoken = { version = "11.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "3.1", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7.18", features = ["rt"] }
toml = "0.9"
tower-http = { version = "0.7", features = ["timeout", "trace"] }
tracing = "0.1.44"
url = "2.5"

[dev-dependencies]
insta = { version = "1.43", features = ["json"] }
rcgen = "0.14"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[[bin]]
name = "rocketmq-mcp-control"
path = "src/main.rs"
