[package]
name                   = "rocketmq-broker"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
keywords.workspace     = true
readme                 = "README.md"
description.workspace  = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default          = ["local_file_store"]
local_file_store = ["rocketmq-store/local_file_store"]
rocksdb_store    = ["rocketmq-store/rocksdb_store", "dep:rocketmq-store-rocksdb"]
rocksdb-store    = ["rocksdb_store"]
extended_timeline = ["rocketmq-store/extended_timeline"]
tieredstore      = ["local_file_store", "rocketmq-store/tieredstore"]
observability    = ["otel-metrics", "otel-traces"]
otel-metrics     = [
  "rocketmq-observability/otel-metrics",
  "rocketmq-store/observability",
  "rocketmq-transport/observability",
]
otel-traces      = [
  "rocketmq-observability/otel-traces",
  "rocketmq-store/observability-traces",
  "rocketmq-transport/observability-traces",
]
otel-logs        = ["rocketmq-observability/otel-logs"]
otlp-metrics     = ["otel-metrics", "rocketmq-observability/otlp-metrics"]
otlp-traces      = ["otel-traces", "rocketmq-observability/otlp-traces"]
otlp-logs        = ["otel-logs", "rocketmq-observability/otlp-logs"]
prometheus       = ["otel-metrics", "rocketmq-observability/prometheus"]
metrics-prometheus = ["prometheus"]
production-observability = ["metrics-prometheus", "otlp-traces", "otlp-logs"]
production      = ["local_file_store", "production-observability"]
test-support    = []

[dependencies]
rocketmq-store       = { workspace = true }
rocketmq-store-rocksdb = { workspace = true, optional = true }
rocketmq-store-api   = { workspace = true }
rocketmq-filter      = { workspace = true }
rocketmq-runtime     = { workspace = true }
rocketmq-error       = { workspace = true }
rocketmq-auth        = { workspace = true }
rocketmq-security-api = { workspace = true }
rocketmq-observability = { workspace = true }
rocketmq-model = { workspace = true }
rocketmq-protocol = { workspace = true }
rocketmq-transport = { workspace = true }


anyhow.workspace = true

tokio.workspace = true
tokio-util.workspace = true

tracing.workspace = true


#JSON support
serde.workspace      = true
serde_json.workspace = true

bytes                 = { workspace = true }
parking_lot.workspace = true

clap = { version = "4.6.1", features = ["derive"] }
config.workspace = true
rand = { workspace = true }

#tools
dirs.workspace = true
dns-lookup     = "3.0"
local-ip-address = "0.6.13"

cfg-if         = { workspace = true }
num_cpus       = { workspace = true }
sysinfo        = { workspace = true }
thiserror      = { workspace = true }
trait-variant  = { workspace = true }
cheetah-string = { workspace = true }
dashmap        = { workspace = true }
arc-swap       = "1.9"

crossbeam-skiplist = "0.1"

futures = "0.3.32"

[dev-dependencies]
rocketmq-transport = { workspace = true, features = ["test-support"] }
criterion            = { version = "0.8", features = ["html_reports"] }
rocketmq-controller  = { workspace = true }
rocketmq-namesrv     = { workspace = true }
tempfile             = "3.27.0"

[[example]]
name = "architecture_transaction_performance_collector"

[[bin]]
name = "rocketmq-broker-rust"
path = "src/bin/broker_bootstrap_server.rs"

[[bench]]
name    = "subscription_group_manager_benchmark"
harness = false

[[bench]]
name    = "schedule_message_service_performance"
harness = false

[[bench]]
name    = "consumer_manager_benchmark"
harness = false

[[bench]]
name    = "consumer_filter_benchmark"
harness = false

[[bench]]
name    = "broker_runtime_lifecycle_bench"
harness = false

[[bench]]
name    = "broker_client_housekeeping_lifecycle_bench"
harness = false

[[bench]]
name    = "broker_topic_queue_mapping_clean_lifecycle_bench"
harness = false

[[bench]]
name    = "broker_fast_failure_lifecycle_bench"
harness = false

[[bench]]
name    = "broker_schedule_persistence_lifecycle_bench"
harness = false

[[bench]]
name    = "send_message_properties_benchmark"
harness = false

[[bench]]
name    = "topic_config_lookup_benchmark"
harness = false

[[bench]]
name    = "pull_pop_response_benchmark"
harness = false

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[[test]]
name = "notification_filtering"
required-features = ["test-support"]

[[test]]
name = "lite_wildcard_group"
required-features = ["test-support"]

[[test]]
name = "lite_ordered_suspend"
required-features = ["test-support"]

[[test]]
name = "transaction_metrics_persistence"
required-features = ["test-support"]

[[test]]
name = "pop_profile_persistence"
required-features = ["rocksdb_store", "test-support"]

[[test]]
name = "pop_profile_runtime_flow"
required-features = ["rocksdb_store", "test-support"]

[[test]]
name = "pop_retry_version_migration"
required-features = ["rocksdb_store", "test-support"]

[[test]]
name              = "upgrade_rollback_matrix"
required-features = ["rocksdb_store"]
