[package]
name = "rocketmq-transport"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["rocketmq-rust", "transport", "tcp", "tls"]
categories = ["asynchronous", "network-programming"]
description = "Bounded TCP/TLS transport for RocketMQ Rust"
rust-version.workspace = true

[features]
default = ["tls", "socks"]
simd = ["rocketmq-protocol/simd"]
tls = ["rcgen", "rustls-native-certs", "tokio-rustls", "dep:pkcs8", "dep:zeroize"]
socks = ["dep:zeroize"]
observability = ["dep:rocketmq-observability", "rocketmq-observability/otel-metrics"]
observability-traces = ["dep:rocketmq-observability"]
test-support = []
linux-sendfile = ["dep:libc"]

[dependencies]
rocketmq-error = { workspace = true }
rocketmq-model = { workspace = true }
rocketmq-protocol = { workspace = true }
rocketmq-runtime = { workspace = true }
rocketmq-security-api = { workspace = true }
rocketmq-observability = { workspace = true, optional = true }
bytes.workspace = true
anyhow.workspace = true
bitvec = "1.0.1"
bytemuck = "1.25.0"
cheetah-string.workspace = true
dashmap = { workspace = true, features = ["serde"] }
flate2.workspace = true
flume = "0.12"
form_urlencoded = "1.2.2"
futures = "0.3"
futures-util = "0.3"
local-ip-address = "0.6.13"
ipnet = { workspace = true, features = ["serde"] }
num_cpus.workspace = true
parking_lot.workspace = true
pin-project-lite = "0.2.16"
rand.workspace = true
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
serde_json_any_key.workspace = true
socket2 = "0.6"
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true
trait-variant.workspace = true
uuid.workspace = true

arc-swap = { version = "1.9" }
rcgen = { version = "0.14", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tokio-rustls = { version = "0.26", optional = true }
pkcs8 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.186", optional = true }

[dev-dependencies]
anyhow.workspace = true
criterion = { version = "0.8.2", features = ["async_tokio"] }
pkcs8.workspace = true
rocketmq-observability = { workspace = true, features = ["prometheus"] }
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "frame_write"
harness = false
required-features = ["test-support"]

[[bench]]
name = "linux_file_send"
harness = false
required-features = ["linux-sendfile", "test-support"]

[[bench]]
name = "p0_overhead"
harness = false
required-features = ["test-support"]

[[bench]]
name = "write_pipeline"
harness = false
required-features = ["test-support"]

[[bench]]
name = "admission_pending_hooks"
harness = false
required-features = ["test-support"]

[[bench]]
name = "processor_dispatch"
harness = false
required-features = ["test-support"]

[[bench]]
name = "remoting_response"
harness = false
required-features = ["test-support"]

[[bench]]
name = "session_client"
harness = false
required-features = ["test-support"]

[[bench]]
name = "network_io"
harness = false
required-features = ["tls", "test-support"]

[[example]]
name = "architecture_network_performance_collector"
required-features = ["test-support"]

[[example]]
name = "transport_hot_path_collector"
required-features = ["test-support"]

[[example]]
name = "tls_scratch_rss_collector"
required-features = ["tls", "test-support"]

[[example]]
name = "transport_p0_probe"
required-features = ["test-support"]

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
