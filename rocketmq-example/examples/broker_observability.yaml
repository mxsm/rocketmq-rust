# Canonical Broker observability config fragment.
# Merge these sections into a complete RawBrokerConfig YAML file.

brokerIdentity:
  brokerName: broker-a
  brokerClusterName: DefaultCluster
  brokerId: 0

observability:
  environment: dev
  serviceInstanceId: broker-a-0
  resourceAttributes:
    deployment.zone: az-a
    deployment.rack: rack-1
  metrics:
    exporter: otlp_grpc
    exportIntervalMillis: 5000
    exportTimeoutMillis: 3000
    cardinalityLimit: 10000
    sampleRatio: 1.0
    topicLabelEnabled: true
    consumerGroupLabelEnabled: true
  traces:
    exporter: otlp_grpc
    sampleRatio: 0.01
    propagateContext: true
    recordMessageId: false
    recordMessageKeys: false
    recordBodySize: true
  logs:
    exporter: otlp_grpc
  otlp:
    endpoint: http://127.0.0.1:4317
    protocol: grpc
    headers: {}
    timeoutMillis: 3000
  prometheus:
    host: 127.0.0.1
    port: 5557
    path: /metrics
