[workspace]
resolver = "2"

[package]
name                   = "rocketmq-mcp"
version                = "1.0.0"
authors                = ["mxsm <mxsm@apache.org>"]
edition                = "2021"
homepage               = "https://github.com/mxsm/rocketmq-rust"
repository             = "https://github.com/mxsm/rocketmq-rust"
license                = "Apache-2.0"
keywords               = ["rocketmq", "mcp", "ai", "sre", "agent"]
categories             = ["development-tools", "command-line-utilities"]
readme                 = "README.md"
description            = "Model Context Protocol server for RocketMQ-Rust AI SRE and diagnostics"
rust-version           = "1.95.0"

[features]
default         = ["read-only", "diagnose", "stdio"]
read-only       = []
diagnose        = ["read-only"]
stdio           = ["rmcp/transport-io"]
observability   = ["rocketmq-observability/observability"]
otlp            = [
    "observability",
    "rocketmq-observability/otlp-metrics",
    "rocketmq-observability/otlp-traces",
    "rocketmq-observability/otlp-logs",
]
auth            = []
streamable-http = [
    "rmcp/transport-streamable-http-server",
    "dep:arc-swap",
    "dep:axum",
    "dep:reqwest",
    "dep:rocketmq-transport",
    "dep:tokio-rustls",
    "dep:tower-http",
    "auth",
]
change-planning = []

[dependencies]
rocketmq-admin-core   = { version = "1.0.0", path = "../rocketmq-admin/rocketmq-admin-core", default-features = false, features = ["read-client-adapter"] }
rocketmq-observability = { version = "1.0.0", path = "../../rocketmq-observability" }
rocketmq-runtime      = { version = "1.0.0", path = "../../rocketmq-runtime" }
rocketmq-security-api = { version = "1.0.0", path = "../../rocketmq-security-api" }
rocketmq-transport    = { version = "1.0.0", path = "../../rocketmq-transport", default-features = false, features = ["tls"], optional = true }

anyhow             = "1.0.102"
arc-swap           = { version = "1.9", optional = true }
async-trait         = "0.1"
axum               = { version = "0.8", optional = true }
chrono             = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap               = { version = "4.6.1", features = ["derive", "env"] }
config             = "0.15.23"
jsonschema         = { version = "0.49", default-features = false }
jsonwebtoken       = { version = "9.3", features = ["use_pem"] }
once_cell          = "1.21"
percent-encoding   = "2.3"
regex              = "1.12.4"
reqwest            = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
rmcp               = { version = "3.1", features = ["server", "macros", "schemars"] }
schemars           = "1.1"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
serde_yaml         = "0.9"
sha2               = "0.11"
thiserror          = "2.0.18"
tokio              = { version = "1.52", features = ["full"] }
tokio-rustls       = { version = "0.26", optional = true }
tokio-util         = { version = "0.7.18", features = ["full"] }
tower-http         = { version = "0.7", features = ["cors", "limit", "timeout", "trace"], optional = true }
tracing            = "0.1.44"
validator          = { version = "0.20", features = ["derive"] }
url                = "2.5"

[dev-dependencies]
base64           = "0.22"
insta             = { version = "1.43", features = ["json"] }
mockall           = "0.15.0"
pretty_assertions = "1.4"
rcgen            = "0.14"
tempfile          = "3.27.0"
tower             = { version = "0.5", features = ["util"] }

[[bin]]
name = "rocketmq-mcp"
path = "src/main.rs"
