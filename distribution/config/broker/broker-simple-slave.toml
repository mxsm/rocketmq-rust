[broker]
listenPort = 10931
storePathRootDir = "/opt/rocketmq/store"

[broker.brokerIdentity]
brokerName = "broker-mxsm-a"
brokerClusterName = "DefaultCluster-mxsm"
brokerId = 1

[broker.brokerServerConfig]
bindAddress = "127.0.0.1"

[store]
compatibilityProfile = "JAVA_5_5"
brokerRole = "SLAVE"
flushDiskType = "ASYNC_FLUSH"
deleteWhen = 4
fileReservedTime = 72
haListenPort = 10912
haMasterAddress = "127.0.0.1:10912"
storePathRootDir = "/opt/rocketmq/store"
