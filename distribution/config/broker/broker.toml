# Canonical broker files keep runtime, storage, and logging settings in
# separate strict sections. Unknown or misplaced fields fail at startup.
[broker]
regionId = "DefaultRegion"
listenPort = 10911
brokerIp1 = "127.0.0.1"
brokerIp2 = "127.0.0.1"
storePathRootDir = "/opt/data/rocketmq/store"
namesrvAddr = "127.0.0.1:9876"
autoCreateTopicEnable = true
traceTopicEnable = false
traceOn = true
brokerPermission = 6
enableControllerMode = false
enableSplitRegistration = false
splitRegistrationSize = 800
registerBrokerTimeoutMills = 24000
enableSingleTopicRegister = true
enableMixedMessageType = false

[broker.brokerIdentity]
brokerName = "broker-mxsm-a"
brokerClusterName = "DefaultCluster-mxsm"
brokerId = 0
isBrokerContainer = false
isInBrokerContainer = false

[broker.topicQueueConfig]
defaultTopicQueueNums = 8

[broker.timerWheelConfig]
timerWheelEnable = false

[store]
storePathRootDir = "/opt/data/rocketmq/store"
brokerRole = "ASYNC_MASTER"
flushDiskType = "ASYNC_FLUSH"
deleteWhen = 4
fileReservedTime = 72
haListenAddress = "0.0.0.0"
haListenPort = 10912
mappedFileSizeCommitLog = 1073741824
mappedFileSizeConsumeQueue = 6000000
mappedFileSizeConsumeQueueExt = 50331648
timerWheelEnable = false
enableCompaction = true
enableAsyncReput = true
compactionThreadNum = 6
