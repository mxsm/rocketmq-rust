deploymentProfile: production-controller-ha

global:
  imagePullSecrets: []
  otelEndpoint: http://otel-collector.observability.svc.cluster.local:4317
  secretRefs:
    existingSecret: rocketmq-runtime-secrets
    secretProviderClassName: ""
  runtimeDiagnostics:
    enabled: false
    bindAddress: "0.0.0.0:8087"
    port: 8087
    tokenFile: "/var/run/secrets/rocketmq/runtime-diagnostics-token"
    sampleIntervalSeconds: 10
    allowInsecureHttp: false
  podSecurity:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

releaseIdentity:
  # Local validation fixture. The reconciler replaces the complete identity from ReleaseState.
  commit: "1111111111111111111111111111111111111111"
  nonce: local-validation
  configDigest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
  secretVersion: local-reference-1
  storageGeneration: 1

maintenance:
  enabled: true
  configMapName: rocketmq-maintenance-policy-v1
  policyKey: maintenance-policy.json
  mountPath: /etc/rocketmq/auth/maintenance-policy.json
  version: 1
  sha256: 951aca122bb23b78e29235aaf05b2dffe9422bf97636ce6ac04fddab969ba0ee

metrics:
  enabled: true
  port: 5557
  path: /metrics
  service:
    enabled: true
  serviceMonitor:
    enabled: false
    # Durations use positive whole seconds or minutes, with at most nine digits.
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  networkPolicy:
    enabled: true
    scraperNamespaceLabels:
      rocketmq.apache.org/observability: "true"
    scraperPodLabels:
      app.kubernetes.io/name: prometheus

namespace:
  create: true

networkPolicy:
  enabled: true
  clientNamespaceLabel: rocketmq.apache.org/client-access
  observabilityNamespaceLabel: rocketmq.apache.org/observability

services:
  broker:
    replicas: 3
    replicaGroupName: rocketmq-broker
    autoCreateTopicEnable: false
    logFilterReloadEnabled: false
    durability:
      flushDiskType: SYNC_FLUSH
      totalReplicas: 3
      inSyncReplicas: 3
      minInSyncReplicas: 2
      allAckInSyncStateSet: true
      slaveTimeoutMillis: 3000
      maxSlaveLagMillis: 15000
      cleanElection: true
    image:
      repository: rocketmq-rust/broker
      tag: local
      digest: ""
      pullPolicy: Never
    persistence:
      enabled: true
      storageClassName: rocketmq-retain
      size: 100Gi
    pdb:
      enabled: true
      minAvailable: 2
    resources:
      requests: {cpu: 1000m, memory: 2Gi}
      limits: {cpu: 4000m, memory: 8Gi}
  namesrv:
    replicas: 3
    discovery:
      enabled: false
      mode: dns
    image:
      repository: rocketmq-rust/namesrv
      tag: local
      digest: ""
      pullPolicy: Never
    persistence:
      enabled: true
      storageClassName: rocketmq-retain
      size: 2Gi
    pdb:
      enabled: true
      minAvailable: 2
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: 1000m, memory: 1Gi}
  controller:
    replicas: 3
    snapshotLogsSinceLast: 5000
    snapshotMaxLogEntriesToKeep: 1000
    peerServiceClusterIPs:
      - 10.96.0.201
      - 10.96.0.202
      - 10.96.0.203
    autoInitializeCluster: true
    storageBackend: RocksDB
    image:
      repository: rocketmq-rust/controller
      tag: local
      digest: ""
      pullPolicy: Never
    persistence:
      enabled: true
      storageClassName: rocketmq-retain
      size: 10Gi
    pdb:
      enabled: true
      minAvailable: 2
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {cpu: 2000m, memory: 2Gi}
  proxy:
    replicas: 2
    image:
      repository: rocketmq-rust/proxy
      tag: local
      digest: ""
      pullPolicy: Never
    innerCredentials:
      enabled: false
      secretName: ""
      secretKey: proxy-inner-credentials.yml
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {cpu: 2000m, memory: 2Gi}
  mcp:
    replicas: 1
    image:
      repository: rocketmq-rust/mcp
      tag: local
      digest: ""
      pullPolicy: Never
    publicBaseUrl: https://mcp.example.invalid
    oauth:
      issuer: https://issuer.example.invalid
      audience: rocketmq-mcp
      jwksUrl: https://issuer.example.invalid/.well-known/jwks.json
    persistence:
      enabled: true
      storageClassName: rocketmq-retain
      size: 10Gi
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: 1000m, memory: 1Gi}
