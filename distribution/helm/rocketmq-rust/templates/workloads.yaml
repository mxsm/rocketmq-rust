          imagePullPolicy: {{ .Values.services.controller.image.pullPolicy }}
          args: ["--config-file", "/etc/rocketmq/controller-config/$(POD_NAME).toml"]
          env:
{{ include "rocketmq.lifecycleEnv" . | indent 12 }}
