        - name: config
          configMap:
            name: rocketmq-controller-config
{{- if .Values.maintenance.enabled }}
        - name: maintenance-policy
          configMap:
            name: {{ .Values.maintenance.configMapName }}
            items:
              - key: {{ .Values.maintenance.policyKey }}
