apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rocketmq-broker
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rocketmq.labels" (dict "root" . "service" "broker") | indent 4 }}
spec:
  serviceName: rocketmq-broker-headless
  replicas: {{ .Values.services.broker.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
{{ include "rocketmq.selectorLabels" (dict "root" . "service" "broker") | indent 6 }}
  template:
    metadata:
      annotations:
{{ include "rocketmq.releaseAnnotations" . | indent 8 }}
      labels:
{{ include "rocketmq.labels" (dict "root" . "service" "broker") | indent 8 }}
    spec:
      serviceAccountName: rocketmq-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{- range . }}
        - name: {{ . | quote }}
{{- end }}
{{- end }}
      securityContext:
{{ include "rocketmq.podSecurityContext" . | indent 8 }}
{{- with (include "rocketmq.topology" (dict "root" . "service" "broker") | trim) }}
{{ . | nindent 6 }}
{{- end }}
      containers:
        - name: broker
          image: {{ include "rocketmq.image" (dict "service" "broker" "image" .Values.services.broker.image) | quote }}
          imagePullPolicy: {{ .Values.services.broker.image.pullPolicy }}
          args: ["--configFile", "/etc/rocketmq/broker.toml"]
          env:
{{ include "rocketmq.lifecycleEnv" . | indent 12 }}
{{ include "rocketmq.releaseIdentityEnv" . | indent 12 }}
{{ with (include "rocketmq.observabilityEnvironmentOverrides" . | trim) }}{{ . | nindent 12 }}{{ end }}
{{ if .Values.global.runtimeDiagnostics.enabled }}{{ include "rocketmq.runtimeDiagnosticsEnv" . | indent 12 }}{{ end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - {name: ROCKETMQ_HOME, value: /var/lib/rocketmq/broker}
            - {name: OTEL_SERVICE_NAME, value: rocketmq-broker}
          ports:
            - {name: health, containerPort: 8088, protocol: TCP}
{{- if .Values.metrics.enabled }}
            - {name: metrics, containerPort: {{ .Values.metrics.port }}, protocol: TCP}
{{- end }}
{{- if .Values.global.runtimeDiagnostics.enabled }}
            - {name: runtime-diag, containerPort: {{ .Values.global.runtimeDiagnostics.port }}, protocol: TCP}
{{- end }}
            - {name: remoting, containerPort: 10911, protocol: TCP}
            - {name: ha, containerPort: 10912, protocol: TCP}
{{ include "rocketmq.lifecycleProbes" . | indent 10 }}
          resources:
{{ toYaml .Values.services.broker.resources | indent 12 }}
          securityContext:
{{ include "rocketmq.containerSecurityContext" . | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rocketmq/broker.toml
              subPathExpr: $(POD_NAME).toml
              readOnly: true
{{- if .Values.maintenance.enabled }}
            - name: maintenance-policy
              mountPath: {{ .Values.maintenance.mountPath }}
              subPath: {{ .Values.maintenance.policyKey }}
              readOnly: true
{{- end }}
            - {name: data, mountPath: /var/lib/rocketmq}
            - {name: runtime-secrets, mountPath: /var/run/secrets/rocketmq, readOnly: true}
            - {name: tmp, mountPath: /tmp/rocketmq}
      volumes:
        - name: config
          configMap:
            name: rocketmq-broker-config
{{- if .Values.maintenance.enabled }}
        - name: maintenance-policy
          configMap:
            name: {{ .Values.maintenance.configMapName }}
            items:
              - key: {{ .Values.maintenance.policyKey }}
                path: {{ .Values.maintenance.policyKey }}
{{- end }}
{{- if not .Values.services.broker.persistence.enabled }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.services.broker.persistence.size }}
{{- end }}
        - name: runtime-secrets
{{- include "rocketmq.secretVolume" . | nindent 10 }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
{{- if .Values.services.broker.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
{{ include "rocketmq.labels" (dict "root" . "service" "broker") | indent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ required "services.broker.persistence.storageClassName is required" .Values.services.broker.persistence.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.services.broker.persistence.size }}
{{- end }}
---
