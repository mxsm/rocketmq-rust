apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-proxy
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rocketmq.labels" (dict "root" . "service" "proxy") | indent 4 }}
spec:
  replicas: {{ .Values.services.proxy.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
{{ include "rocketmq.selectorLabels" (dict "root" . "service" "proxy") | indent 6 }}
  template:
    metadata:
      annotations:
{{ include "rocketmq.releaseAnnotations" . | indent 8 }}
      labels:
{{ include "rocketmq.labels" (dict "root" . "service" "proxy") | indent 8 }}
    spec:
      serviceAccountName: rocketmq-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{- range . }}
        - name: {{ . | quote }}
{{- end }}
{{- end }}
      securityContext:
{{ include "rocketmq.podSecurityContext" . | indent 8 }}
{{- with (include "rocketmq.topology" (dict "root" . "service" "proxy") | trim) }}
{{ . | nindent 6 }}
{{- end }}
      containers:
        - name: proxy
          image: {{ include "rocketmq.image" (dict "service" "proxy" "image" .Values.services.proxy.image) | quote }}
          imagePullPolicy: {{ .Values.services.proxy.image.pullPolicy }}
          args: ["--config", "/etc/rocketmq/proxy.toml"]
          env:
{{ include "rocketmq.lifecycleEnv" . | indent 12 }}
{{ include "rocketmq.releaseIdentityEnv" . | indent 12 }}
{{ with (include "rocketmq.observabilityEnvironmentOverrides" . | trim) }}{{ . | nindent 12 }}{{ end }}
{{ if .Values.global.runtimeDiagnostics.enabled }}{{ include "rocketmq.runtimeDiagnosticsEnv" . | indent 12 }}{{ end }}
            - {name: ROCKETMQ_HOME, value: /var/lib/rocketmq/proxy}
            - {name: OTEL_SERVICE_NAME, value: rocketmq-proxy}
          ports:
            - {name: health, containerPort: 8088, protocol: TCP}
{{- if .Values.metrics.enabled }}
            - {name: metrics, containerPort: {{ .Values.metrics.port }}, protocol: TCP}
{{- end }}
{{- if .Values.global.runtimeDiagnostics.enabled }}
            - {name: runtime-diag, containerPort: {{ .Values.global.runtimeDiagnostics.port }}, protocol: TCP}
{{- end }}
            - {name: remoting, containerPort: 8080, protocol: TCP}
            - {name: grpc, containerPort: 8081, protocol: TCP}
{{ include "rocketmq.lifecycleProbes" . | indent 10 }}
          resources:
{{ toYaml .Values.services.proxy.resources | indent 12 }}
          securityContext:
{{ include "rocketmq.containerSecurityContext" . | indent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/rocketmq/proxy.toml, subPath: proxy.toml, readOnly: true}
            - {name: data, mountPath: /var/lib/rocketmq/proxy}
{{- if .Values.services.proxy.innerCredentials.enabled }}
            - {name: proxy-inner-credentials, mountPath: /var/lib/rocketmq/proxy/conf, readOnly: true}
{{- end }}
            - {name: runtime-secrets, mountPath: /var/run/secrets/rocketmq, readOnly: true}
            - {name: tmp, mountPath: /tmp/rocketmq}
      volumes:
        - name: config
          configMap:
            name: rocketmq-proxy-config
        - name: data
          emptyDir:
            sizeLimit: 2Gi
{{- if .Values.services.proxy.innerCredentials.enabled }}
        - name: proxy-inner-credentials
          secret:
            secretName: {{ required "services.proxy.innerCredentials.secretName is required when inner credentials are enabled" .Values.services.proxy.innerCredentials.secretName | quote }}
            optional: false
            defaultMode: 0440
            items:
              - key: {{ required "services.proxy.innerCredentials.secretKey is required when inner credentials are enabled" .Values.services.proxy.innerCredentials.secretKey | quote }}
                path: tools.yml
{{- end }}
        - name: runtime-secrets
{{- include "rocketmq.secretVolume" . | nindent 10 }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
{{- if .Values.services.mcp.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rocketmq-mcp-audit
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rocketmq.labels" (dict "root" . "service" "mcp") | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    rocketmqrust.com/persisted-format: mcp-audit-v1
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ required "services.mcp.persistence.storageClassName is required" .Values.services.mcp.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.services.mcp.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-mcp
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rocketmq.labels" (dict "root" . "service" "mcp") | indent 4 }}
spec:
  replicas: {{ .Values.services.mcp.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
{{ include "rocketmq.selectorLabels" (dict "root" . "service" "mcp") | indent 6 }}
  template:
    metadata:
      annotations:
{{ include "rocketmq.releaseAnnotations" . | indent 8 }}
      labels:
{{ include "rocketmq.labels" (dict "root" . "service" "mcp") | indent 8 }}
    spec:
      serviceAccountName: rocketmq-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{- range . }}
        - name: {{ . | quote }}
{{- end }}
{{- end }}
      securityContext:
{{ include "rocketmq.podSecurityContext" . | indent 8 }}
{{- with (include "rocketmq.topology" (dict "root" . "service" "mcp") | trim) }}
{{ . | nindent 6 }}
{{- end }}
      containers:
        - name: mcp
          image: {{ include "rocketmq.image" (dict "service" "mcp" "image" .Values.services.mcp.image) | quote }}
          imagePullPolicy: {{ .Values.services.mcp.image.pullPolicy }}
          args: ["--config", "/etc/rocketmq/mcp.toml", "--transport", "streamable-http"]
          env:
{{ include "rocketmq.lifecycleEnv" . | indent 12 }}
{{ include "rocketmq.releaseIdentityEnv" . | indent 12 }}
{{ with (include "rocketmq.observabilityEnvironmentOverrides" . | trim) }}{{ . | nindent 12 }}{{ end }}
            - {name: ROCKETMQ_HOME, value: /var/lib/rocketmq/mcp}
            - {name: OTEL_SERVICE_NAME, value: rocketmq-mcp}
          ports:
            - {name: health, containerPort: 8088, protocol: TCP}
{{- if .Values.metrics.enabled }}
            - {name: metrics, containerPort: {{ .Values.metrics.port }}, protocol: TCP}
{{- end }}
            - {name: https-mcp, containerPort: 8089, protocol: TCP}
{{ include "rocketmq.lifecycleProbes" . | indent 10 }}
          resources:
{{ toYaml .Values.services.mcp.resources | indent 12 }}
          securityContext:
{{ include "rocketmq.containerSecurityContext" . | indent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/rocketmq/mcp.toml, subPath: mcp.toml, readOnly: true}
            - {name: config, mountPath: /etc/rocketmq/permissions.toml, subPath: permissions.toml, readOnly: true}
            - {name: audit, mountPath: /var/lib/rocketmq/mcp}
            - {name: runtime-secrets, mountPath: /var/run/secrets/rocketmq, readOnly: true}
            - {name: tmp, mountPath: /tmp/rocketmq}
      volumes:
        - name: config
          configMap:
            name: rocketmq-mcp-config
        - name: audit
{{- if .Values.services.mcp.persistence.enabled }}
          persistentVolumeClaim:
            claimName: rocketmq-mcp-audit
{{- else }}
          emptyDir:
            sizeLimit: {{ .Values.services.mcp.persistence.size }}
{{- end }}
        - name: runtime-secrets
{{- include "rocketmq.secretVolume" . | nindent 10 }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
