  serviceName: rocketmq-controller-headless
  replicas: {{ .Values.services.controller.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
{{ include "rocketmq.selectorLabels" (dict "root" . "service" "controller") | indent 6 }}
  template:
    metadata:
