{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rocketmq-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: rocketmq-rust
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: rocketmq-rust
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rocketmq-dns-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: rocketmq-rust
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rocketmq-otel-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: rocketmq-rust
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.observabilityNamespaceLabel }}: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - {protocol: TCP, port: 4317}
---
{{- if .Values.global.runtimeDiagnostics.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rocketmq-runtime-diagnostics
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: rocketmqrust.com/service
        operator: In
        values: [broker, namesrv, controller, proxy]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.clientNamespaceLabel }}: "true"
          podSelector:
            matchLabels:
              rocketmqrust.com/sre-connector: "true"
      ports:
        - {protocol: TCP, port: {{ .Values.global.runtimeDiagnostics.port }}}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rocketmq-controller
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      rocketmqrust.com/service: controller
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: controller
      ports:
        - {protocol: TCP, port: 60110}
    - from:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: broker
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.clientNamespaceLabel }}: "true"
      ports:
        - {protocol: TCP, port: 60109}
  egress:
    - to:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: controller
      ports:
        - {protocol: TCP, port: 60110}
    - to:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: broker
      ports:
        - {protocol: TCP, port: 10911}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rocketmq-broker
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      rocketmqrust.com/service: broker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: broker
      ports:
        - {protocol: TCP, port: 10912}
    - from:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: controller
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: proxy
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: mcp
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.clientNamespaceLabel }}: "true"
      ports:
        - {protocol: TCP, port: 10911}
  egress:
    - to:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: broker
      ports:
        - {protocol: TCP, port: 10912}
    - to:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: namesrv
      ports:
        - {protocol: TCP, port: 9876}
    - to:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: controller
      ports:
        - {protocol: TCP, port: 60109}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rocketmq-namesrv
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      rocketmqrust.com/service: namesrv
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: broker
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: proxy
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: mcp
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.clientNamespaceLabel }}: "true"
      ports:
        - {protocol: TCP, port: 9876}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rocketmq-proxy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      rocketmqrust.com/service: proxy
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.clientNamespaceLabel }}: "true"
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8081}
  egress:
    - to:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: namesrv
      ports:
        - {protocol: TCP, port: 9876}
    - to:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: broker
      ports:
        - {protocol: TCP, port: 10911}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rocketmq-mcp
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      rocketmqrust.com/service: mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.clientNamespaceLabel }}: "true"
      ports:
        - {protocol: TCP, port: 8089}
  egress:
    - to:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: namesrv
      ports:
        - {protocol: TCP, port: 9876}
    - to:
        - podSelector:
            matchLabels:
              rocketmqrust.com/service: broker
      ports:
        - {protocol: TCP, port: 10911}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - {protocol: TCP, port: 443}
{{- if and .Values.metrics.enabled .Values.metrics.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rocketmq-metrics-scrape
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: rocketmq-rust
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/part-of: rocketmq-rust
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
{{ toYaml .Values.metrics.networkPolicy.scraperNamespaceLabels | indent 14 }}
          podSelector:
            matchLabels:
{{ toYaml .Values.metrics.networkPolicy.scraperPodLabels | indent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.metrics.port }}}
{{- end }}
{{- end }}
