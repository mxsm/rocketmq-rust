deploymentProfile: production-controller-ha

# Local rendering fixture. The release-state reconciler replaces every value from
# a validated candidate and never treats this fixture as deployable state.
releaseIdentity:
  commit: "1111111111111111111111111111111111111111"
  nonce: local-validation
  configDigest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
  secretVersion: local-reference-1
  storageGeneration: 1

maintenance:
  enabled: true
  configMapName: rocketmq-maintenance-policy-v1
  policyKey: maintenance-policy.json
  mountPath: /etc/rocketmq/auth/maintenance-policy.json
  version: 1
  sha256: 951aca122bb23b78e29235aaf05b2dffe9422bf97636ce6ac04fddab969ba0ee

# These tags are loaded into the local cluster and are never pulled. Build them
# with `docker buildx build --load`, then use the cluster-specific image-load command.
services:
  broker:
    replicas: 3
    replicaGroupName: rocketmq-broker
    durability:
      flushDiskType: SYNC_FLUSH
      totalReplicas: 3
      inSyncReplicas: 3
      minInSyncReplicas: 2
      allAckInSyncStateSet: true
      slaveTimeoutMillis: 3000
      maxSlaveLagMillis: 15000
      cleanElection: true
    image:
      repository: rocketmq-rust/broker
      tag: local
      digest: ""
      pullPolicy: Never
  namesrv:
    replicas: 3
    discovery:
      enabled: true
      mode: dns
    image:
      repository: rocketmq-rust/namesrv
      tag: local
      digest: ""
      pullPolicy: Never
  controller:
    replicas: 3
    peerServiceClusterIPs:
      - 10.96.0.201
      - 10.96.0.202
      - 10.96.0.203
    autoInitializeCluster: true
    storageBackend: RocksDB
    image:
      repository: rocketmq-rust/controller
      tag: local
      digest: ""
      pullPolicy: Never
  proxy:
    replicas: 2
    image:
      repository: rocketmq-rust/proxy
      tag: local
      digest: ""
      pullPolicy: Never
  mcp:
    replicas: 1
    image:
      repository: rocketmq-rust/mcp
      tag: local
      digest: ""
      pullPolicy: Never
