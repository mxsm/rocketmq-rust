securityProfile: production

global:
  candidateVersion: "1.0.0"
  imageRegistry: "ghcr.io/mxsm/rocketmq-rust"
  imagePullPolicy: IfNotPresent
  storageClassName: ""
  clusterDomain: cluster.local
  clusterName: DefaultCluster

runtime:
  healthPort: 8088
  shutdownTimeoutSeconds: 45
  terminationGracePeriodSeconds: 60
  livenessStaleSeconds: 30
  startupFailureThreshold: 60

persistence:
  whenDeleted: Retain
  whenScaled: Retain

placement:
  # Production profiles require separate hosts; zone spread is best effort.
  requireSeparateHosts: false
  spreadAcrossZones: true

networkPolicy:
  enabled: true
  # Add namespace selectors for clients outside this release. Health stays internal.
  clientNamespaceSelector: {}

services:
  namesrv:
    enabled: true
    replicas: 1
    port: 9876
    storage: 1Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
    auth: {enabled: true, secretName: rocketmq-namesrv-auth, aclKey: plain_acl.yml, credentialsKey: inner-client.json}
  broker:
    enabled: true
    replicas: 1
    port: 10911
    storage: 10Gi
    controllerMode: false
    haPort: 10912
    brokerName: broker-a
    minInSyncReplicas: 1
    flushDiskType: SYNC_FLUSH
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    auth: {enabled: true, secretName: rocketmq-broker-auth, aclKey: plain_acl.yml, credentialsKey: inner-client.json}
  controller:
    enabled: false
    replicas: 3
    port: 9878
    storage: 2Gi
    raftPort: 9879
    storageBackend: RocksDB
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    auth: {enabled: true, secretName: rocketmq-controller-auth, aclKey: plain_acl.yml, credentialsKey: inner-client.json}
  proxy:
    enabled: false
    replicas: 1
    port: 8081
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "2", memory: 1Gi}
    auth: {enabled: true, secretName: rocketmq-proxy-auth, aclKey: plain_acl.yml, credentialsKey: inner-client.json}
    cluster:
      ioMaxInflight: 256
      controlReserve: 32
      commandQueueCapacity: 4096
    tls:
      enabled: false
      secretName: ""
      clientAuth: none
      clientCaKey: ca.crt
