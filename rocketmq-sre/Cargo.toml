[workspace]
members = [
  "crates/rocketmq-sre-contracts",
  "crates/rocketmq-sre-core",
  "crates/rocketmq-sre-model-gateway",
  "crates/rocketmq-sre-control-plane",
  "crates/rocketmq-sre-connector",
  "crates/rocketmq-sre-executor",
  "crates/rocketmq-sre-execution-agent",
  "crates/rocketmq-sre-probe",
  "crates/rocketmq-sre-eval",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["mxsm <mxsm@apache.org>"]
edition = "2024"
homepage = "https://github.com/mxsm/rocketmq-rust"
repository = "https://github.com/mxsm/rocketmq-rust"
license = "Apache-2.0"
rust-version = "1.95.0"

[workspace.dependencies]
axum = "0.8.4"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
http = "1.3.1"
hmac = "0.12.1"
jsonwebtoken = { version = "9.3.1", features = ["use_pem"] }
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "ring", "rustls-tls"] }
object_store = { version = "0.12.4", features = ["aws", "fs"] }
prost = "0.14.4"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
schemars = { version = "1.2.1", features = ["chrono04", "semver1", "uuid1"] }
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.12"
tokio = { version = "1.52.0", features = ["macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net", "sync"] }
tonic = { version = "0.14.6", features = ["codegen", "tls-ring", "transport"] }
tonic-prost = "0.14.6"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
url = { version = "2.5.4", features = ["serde"] }

rocketmq-sre-contracts = { path = "crates/rocketmq-sre-contracts" }
rocketmq-sre-core = { path = "crates/rocketmq-sre-core" }
rocketmq-sre-model-gateway = { path = "crates/rocketmq-sre-model-gateway" }
rocketmq-admin-core = { path = "../rocketmq-tools/rocketmq-admin/rocketmq-admin-core", default-features = false }
rocketmq-client-rust = { path = "../rocketmq-client", default-features = false }
rocketmq-error = { path = "../rocketmq-error" }
rocketmq-model = { path = "../rocketmq-model" }
rocketmq-observability = { path = "../rocketmq-observability" }
rocketmq-runtime = { path = "../rocketmq-runtime" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
