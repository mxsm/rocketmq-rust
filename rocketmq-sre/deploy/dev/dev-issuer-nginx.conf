server {
    listen 8443 ssl;
    server_name dev-issuer-tls localhost;

    ssl_certificate /etc/rocketmq/tls/server-cert.pem;
    ssl_certificate_key /etc/rocketmq/tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    location / {
        proxy_pass http://dev-issuer:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
