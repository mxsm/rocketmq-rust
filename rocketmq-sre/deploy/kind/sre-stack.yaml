        app.kubernetes.io/name: rocketmq-sre-ui
        app.kubernetes.io/part-of: rocketmq-sre
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ui
          image: rocketmq-rust/sre-ui:phase00-local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3004
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
