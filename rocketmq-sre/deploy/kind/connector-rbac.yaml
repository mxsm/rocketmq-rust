apiVersion: v1
kind: ServiceAccount
metadata:
  name: rocketmq-sre-connector
  namespace: rocketmq-system
  labels:
    app.kubernetes.io/name: rocketmq-sre-connector
    app.kubernetes.io/part-of: rocketmq-sre
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rocketmq-sre-connector-read
  namespace: rocketmq-system
  labels:
    app.kubernetes.io/name: rocketmq-sre-connector
    app.kubernetes.io/part-of: rocketmq-sre
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rocketmq-sre-connector-read
  namespace: rocketmq-system
  labels:
    app.kubernetes.io/name: rocketmq-sre-connector
    app.kubernetes.io/part-of: rocketmq-sre
subjects:
  - kind: ServiceAccount
    name: rocketmq-sre-connector
    namespace: rocketmq-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rocketmq-sre-connector-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rocketmq-sre-connector-node-read
  labels:
    app.kubernetes.io/name: rocketmq-sre-connector
    app.kubernetes.io/part-of: rocketmq-sre
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rocketmq-sre-connector-node-read
  labels:
    app.kubernetes.io/name: rocketmq-sre-connector
    app.kubernetes.io/part-of: rocketmq-sre
subjects:
  - kind: ServiceAccount
    name: rocketmq-sre-connector
    namespace: rocketmq-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rocketmq-sre-connector-node-read
