apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - sre-stack.yaml
  - observability.yaml
  - connector-service.yaml
  - connector-rbac.yaml
  - control-plane-network-policy.yaml
  - execution-stack.yaml
  - execution-rbac.yaml
  - execution-observability-rbac.yaml
  - execution-network-policy.yaml

configMapGenerator:
  - name: sre-control-plane-mtls-proxy
    namespace: rocketmq-sre
    files:
      - nginx.conf=control-plane-mtls-nginx.conf

generatorOptions:
  disableNameSuffixHash: true
