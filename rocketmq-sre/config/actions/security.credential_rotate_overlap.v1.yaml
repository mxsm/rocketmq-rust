id: security.credential_rotate_overlap.v1
version: 1.0.0
owner: messaging-security
supported_versions:
  - family: rocketmq-sre.action-plan
    major: 1
    minor: 0
required_capabilities:
  - security.typed-credential-overlap
  - security.credential-probe
config_schema:
  type: object
  additionalProperties: false
parameter_schema:
  type: object
  additionalProperties: false
  required:
    [credential_set, active_version, candidate_version, candidate_secret_ref, overlap_seconds, validation_probe_topic]
  properties:
    credential_set: { type: string, maxLength: 128 }
    active_version: { type: string, maxLength: 128 }
    candidate_version: { type: string, maxLength: 128 }
    candidate_secret_ref: { type: string, maxLength: 255 }
    overlap_seconds: { type: integer, minimum: 60, maximum: 3600 }
    validation_probe_topic: { type: string, maxLength: 255 }
status: active
deprecation: null
risk: r2
execution_supported: true
preconditions:
  - valid_heterogeneous_critic
  - plan_not_expired
  - candidate_secret_reference_resolves
  - active_credential_still_valid
  - overlap_supported
  - synthetic_probe_is_dedicated
max_impact: single_resource
verification:
  resource_conditions: [candidate_active, previous_retiring, overlap_deadline_recorded]
  technical_slis: [credential_probe_success_ratio, authentication_error_ratio]
  stable_window_seconds: 300
  max_wait_seconds: 1800
timeout_seconds: 1800
compensation:
  mode: automatic
  required_before_fields: [active_version, candidate_version]
  timeout_seconds: 600
forbidden_fields: [secret, secret_value, private_key, revoke_active_first, permission_change, acl_change, tls_change]
plan_only: false
