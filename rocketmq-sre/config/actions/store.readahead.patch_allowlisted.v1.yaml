id: store.readahead.patch_allowlisted.v1
version: 1.0.0
owner: messaging-storage
supported_versions:
  - family: rocketmq-sre.action-plan
    major: 1
    minor: 0
required_capabilities:
  - admin.store-readahead-generation-cas
config_schema:
  type: object
  additionalProperties: false
parameter_schema:
  type: object
  additionalProperties: false
  required: [broker, expected_generation, patch]
  properties:
    broker: { type: string, maxLength: 128 }
    expected_generation: { type: integer, minimum: 1 }
    patch:
      type: object
      minProperties: 1
      maxProperties: 3
      additionalProperties: false
      properties:
        read_ahead_message_count_threshold: { type: integer, minimum: 1, maximum: 100000 }
        prefetch_max_bytes: { type: integer, minimum: 4096, maximum: 67108864 }
        max_read_ahead_batches: { type: integer, minimum: 1, maximum: 128 }
status: active
deprecation: null
risk: r2
execution_supported: false
preconditions:
  - valid_heterogeneous_critic
  - broker_generation_matches
  - page_cache_and_memory_headroom_healthy
  - every_field_within_safe_range
max_impact: allowlisted_fields
verification:
  resource_conditions: [broker_generation_incremented, patch_visible]
  technical_slis: [store_read_latency, broker_memory_pressure, page_cache_hit_ratio]
  stable_window_seconds: 300
  max_wait_seconds: 1200
timeout_seconds: 1200
compensation:
  mode: automatic
  required_before_fields: [before_config, latest_generation]
  timeout_seconds: 600
forbidden_fields: [delete, retention, mapped_file_size, commitlog_path, flush_mode, raw_request_code]
plan_only: false
