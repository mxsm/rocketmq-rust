name: Website Deploy Check

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.agents/skills/rocketmq-rust-local-cluster/**'
      - 'rocketmq-website/**'
      - '.github/workflows/website-check.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ./rocketmq-website
        run: npm ci

      - name: Build website
        working-directory: ./rocketmq-website
        run: npm run build

      - name: Verify published Agent Skill
        working-directory: ./rocketmq-website
        run: node --test tests/publishedAgentSkill.test.mjs

      - name: Build success
        run: echo "✅ Build completed successfully!"
