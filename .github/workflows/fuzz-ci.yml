name: Fuzz Target Build

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'fuzz/**'
      - 'rocketmq-broker/**'
      - 'rocketmq-controller/**'
      - 'rocketmq-protocol/**'
      - 'rocketmq-store-local/**'
      - 'scripts/architecture_evidence_governance_guard.py'
      - 'scripts/architecture-risk-test-matrix.json'
      - 'scripts/property-state-suite-registry.json'
      - 'scripts/architecture-debt-registry.json'
      - 'codecov.yml'
      - '.github/workflows/fuzz-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fuzz/**'
      - 'rocketmq-broker/**'
      - 'rocketmq-controller/**'
      - 'rocketmq-protocol/**'
      - 'rocketmq-store-local/**'
      - 'scripts/architecture_evidence_governance_guard.py'
      - 'scripts/architecture-risk-test-matrix.json'
      - 'scripts/property-state-suite-registry.json'
      - 'scripts/architecture-debt-registry.json'
      - 'codecov.yml'
      - '.github/workflows/fuzz-ci.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1-6"
    - cron: "17 18 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all owned fuzz targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up fixed nightly
        run: rustup toolchain install nightly-2026-07-05 --profile minimal

      - name: Validate fuzz ownership and retention policy
        run: python scripts/architecture_evidence_governance_guard.py

      - name: Build fuzz target
        run: >-
          cargo +nightly-2026-07-05 check
          --locked
          --manifest-path fuzz/Cargo.toml
          --all-targets
          --all-features

  exercise:
    name: Exercise ${{ matrix.target }}
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - protocol_decode
          - raw_broker_config
          - controller_snapshot
          - store_recovery_record
    env:
      FUZZ_SECONDS: ${{ github.event.schedule == '17 18 * * 0' && '900' || github.event_name == 'pull_request' && '10' || '60' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up fixed nightly
        run: rustup toolchain install nightly-2026-07-05 --profile minimal

      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-07-05 install cargo-fuzz --locked --version 0.13.2

      - name: Exercise curated corpus
        working-directory: fuzz
        run: >-
          cargo +nightly-2026-07-05 fuzz run ${{ matrix.target }}
          --features ${{ matrix.target }}
          --
          -max_total_time=${FUZZ_SECONDS}
          -print_final_stats=1

      - name: Retain corpus and crash reproducer
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-fuzz-${{ matrix.target }}-${{ github.sha }}
          path: |
            fuzz/corpus/${{ matrix.target }}
            fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 30
