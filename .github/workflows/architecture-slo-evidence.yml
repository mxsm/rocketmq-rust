name: Architecture production-readiness SLO evidence

on:
  pull_request:
    paths:
      - ".github/actionlint.yaml"
      - ".github/workflows/architecture-slo-evidence.yml"
      - ".github/workflows/service-image-publish.yml"
      - "distribution/config/architecture-production-readiness-policy.json"
      - "distribution/config/grafana-architecture-production-readiness.json"
      - "distribution/config/prometheus-architecture-production-readiness-alerts.yaml"
      - "distribution/kubernetes/fault-matrix-policy.json"
      - "rocketmq-doc/en/architecture-production-readiness-runbook.md"
      - "scripts/architecture_slo_guard.py"
      - "scripts/fault_matrix_guard.py"
      - "scripts/kind-architecture-refactor-e2e.ps1"
      - "scripts/new-m11-evidence-secrets.ps1"
      - "scripts/run-architecture-slo-cluster.ps1"
      - "scripts/run-architecture-slo-evidence.ps1"
      - "scripts/telemetry-semantic-registry.json"
      - "scripts/verify_service_image_publication.py"
      - "scripts/tests/test_architecture_slo_guard.py"
      - "scripts/tests/test_service_image_publication_verifier.py"
      - "scripts/tests/test_m11_dynamic_evidence.py"
      - "scripts/tests/fixtures/m11-slo/**"
  push:
    branches: [main]
    paths:
      - ".github/actionlint.yaml"
      - ".github/workflows/architecture-slo-evidence.yml"
      - ".github/workflows/service-image-publish.yml"
      - "distribution/config/architecture-production-readiness-policy.json"
      - "distribution/config/grafana-architecture-production-readiness.json"
      - "distribution/config/prometheus-architecture-production-readiness-alerts.yaml"
      - "distribution/kubernetes/fault-matrix-policy.json"
      - "rocketmq-doc/en/architecture-production-readiness-runbook.md"
      - "scripts/architecture_slo_guard.py"
      - "scripts/fault_matrix_guard.py"
      - "scripts/kind-architecture-refactor-e2e.ps1"
      - "scripts/new-m11-evidence-secrets.ps1"
      - "scripts/run-architecture-slo-cluster.ps1"
      - "scripts/run-architecture-slo-evidence.ps1"
      - "scripts/telemetry-semantic-registry.json"
      - "scripts/verify_service_image_publication.py"
      - "scripts/tests/test_architecture_slo_guard.py"
      - "scripts/tests/test_service_image_publication_verifier.py"
      - "scripts/tests/test_m11_dynamic_evidence.py"
      - "scripts/tests/fixtures/m11-slo/**"
  workflow_dispatch:
    inputs:
      backend:
        description: Dynamic cluster backend
        required: true
        type: choice
        options: [kind, k3d]
      baseline_images_json:
        description: Five baseline service image@sha256 references
        required: true
        type: string
      candidate_publication_json:
        description: Signed five-image service publication.json for the checked-out candidate
        required: true
        type: string
      collector_image:
        description: OpenTelemetry Collector image@sha256 reference
        required: true
        default: docker.io/otel/opentelemetry-collector-contrib@sha256:9c247564e65ca19f97d891cca19a1a8d291ce631b890885b44e3503c5fdb3895
        type: string
      prometheus_image:
        description: Prometheus image@sha256 reference for the private evidence cluster
        required: true
        default: docker.io/prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
        type: string
  schedule:
    - cron: "47 21 * * 6"

permissions:
  contents: read
  packages: read

jobs:
  static-contract:
    name: Policy, fixture, and deliberate violations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate SLO policy and fixture
        shell: bash
        run: |
          python scripts/architecture_slo_guard.py --policy-only
          python scripts/architecture_slo_guard.py \
            --evidence scripts/tests/fixtures/m11-slo/pass \
            --allow-fixture
          python -m unittest scripts.tests.test_architecture_slo_guard -v

      - name: Validate PowerShell entrypoint without dynamic execution
        shell: pwsh
        run: ./scripts/run-architecture-slo-evidence.ps1 -Mode Validate

  dynamic-candidate:
    name: Dynamic fault and six-hour SLO evidence
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: [self-hosted, linux, x64, rocketmq-architecture-evidence]
    timeout-minutes: 540
    env:
      EVIDENCE_BACKEND: ${{ github.event_name == 'workflow_dispatch' && inputs.backend || vars.ARCHITECTURE_FAULT_BACKEND || 'kind' }}
      BASELINE_IMAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_images_json || vars.ARCHITECTURE_BASELINE_IMAGES_JSON }}
      CANDIDATE_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_publication_json || vars.ARCHITECTURE_CANDIDATE_PUBLICATION_JSON }}
      COLLECTOR_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.collector_image || vars.ARCHITECTURE_COLLECTOR_IMAGE || 'docker.io/otel/opentelemetry-collector-contrib@sha256:9c247564e65ca19f97d891cca19a1a8d291ce631b890885b44e3503c5fdb3895' }}
      PROMETHEUS_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.prometheus_image || vars.ARCHITECTURE_PROMETHEUS_IMAGE || 'docker.io/prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bind immutable candidate commit
        id: bind-candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_COMMIT=$(git rev-parse HEAD)
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          echo "candidate_commit=$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2

      - name: Install digest-verified cluster tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          echo 'a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  /tmp/kind' | sha256sum --check
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

          curl --fail --location --silent --show-error \
            --output /tmp/k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo '06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  /tmp/k3d' | sha256sum --check
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d

          curl --fail --location --silent --show-error \
            --output /tmp/kubectl https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          echo '4f6a959dcc5b702135f8354cc7109b542a2933c46b808b248a214c1f69f817ea  /tmp/kubectl' | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          curl --fail --location --silent --show-error \
            --output /tmp/helm.tgz https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz
          echo 'e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  /tmp/helm.tgz' | sha256sum --check
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Authenticate immutable service image pulls
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Verify candidate publication and export immutable image map
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.bind-candidate.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          mkdir -p target/slo-inputs
          printf '%s' "$CANDIDATE_PUBLICATION" > target/slo-inputs/publication.json
          python scripts/verify_service_image_publication.py \
            --publication target/slo-inputs/publication.json \
            --candidate "$CANDIDATE_COMMIT" \
            --output-image-map target/slo-inputs/candidate-images.json

      - name: Materialize baseline and run-scoped credentials
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/slo-inputs | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $PWD target/slo-inputs/baseline-images.json),
            $env:BASELINE_IMAGES,
            [Text.UTF8Encoding]::new($false)
          )
          ./scripts/new-m11-evidence-secrets.ps1 `
            -Mode Generate `
            -OutputDirectory target/slo-inputs

      - name: Execute the dynamic fault matrix and keep the cluster
        shell: pwsh
        run: >-
          ./scripts/kind-architecture-refactor-e2e.ps1
          -Mode Run
          -Backend '${{ env.EVIDENCE_BACKEND }}'
          -CandidateCommit '${{ steps.bind-candidate.outputs.candidate_commit }}'
          -BaselineImageMap target/slo-inputs/baseline-images.json
          -CandidateImageMap target/slo-inputs/candidate-images.json
          -RuntimeSecretManifest target/slo-inputs/runtime-secret.yaml
          -RotatedRuntimeSecretManifest target/slo-inputs/rotated-runtime-secret.yaml
          -BaselineDriverSecretManifest target/slo-inputs/baseline-driver-secret.yaml
          -RotatedDriverSecretManifest target/slo-inputs/rotated-driver-secret.yaml
          -CollectorImage '${{ env.COLLECTOR_IMAGE }}'
          -KeepCluster

      - name: Promote candidate images for the sustained soak
        shell: pwsh
        run: |
          $images = Get-Content -Raw target/slo-inputs/candidate-images.json | ConvertFrom-Json
          foreach ($service in @('broker', 'namesrv', 'controller')) {
            kubectl -n rocketmq-system set image "statefulset/rocketmq-$service" "$service=$($images.$service)"
            kubectl -n rocketmq-system rollout status "statefulset/rocketmq-$service" --timeout=300s
          }
          foreach ($service in @('proxy', 'mcp')) {
            kubectl -n rocketmq-system set image "deployment/rocketmq-$service" "$service=$($images.$service)"
            kubectl -n rocketmq-system rollout status "deployment/rocketmq-$service" --timeout=300s
          }

      - name: Collect and validate six-hour evidence
        shell: pwsh
        run: |
          $fault = Get-ChildItem target/architecture-refactor/M11/fault-matrix -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $fault) { throw 'dynamic fault evidence directory is missing' }
          ./scripts/run-architecture-slo-cluster.ps1 `
            -Mode Run `
            -CandidateCommit '${{ steps.bind-candidate.outputs.candidate_commit }}' `
            -CandidateImageMap target/slo-inputs/candidate-images.json `
            -FaultEvidence $fault.FullName `
            -PrometheusImage '${{ env.PROMETHEUS_IMAGE }}' `
            -Backend '${{ env.EVIDENCE_BACKEND }}'

      - name: Delete the retained cluster
        if: always()
        shell: bash
        run: |
          if [ '${{ env.EVIDENCE_BACKEND }}' = kind ]; then
            kind delete cluster --name rocketmq-architecture-refactor || true
          else
            k3d cluster delete rocketmq-architecture-refactor || true
          fi

      - name: Remove run-scoped credentials and registry session
        if: always()
        shell: pwsh
        run: |
          $inputDirectory = Join-Path $PWD 'target/slo-inputs'
          if (Test-Path -LiteralPath $inputDirectory) {
            Remove-Item -LiteralPath $inputDirectory -Recurse -Force
          }
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            docker logout ghcr.io 2>&1 | Out-Null
          }
          $global:LASTEXITCODE = 0

      - name: Upload immutable release evidence
        if: always() && steps.bind-candidate.outputs.candidate_commit != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m11-12-r24-${{ env.EVIDENCE_BACKEND }}-${{ steps.bind-candidate.outputs.candidate_commit }}
          path: |
            target/architecture-refactor/M11/fault-matrix
            target/architecture-refactor/M11/slo
            target/architecture-refactor/M11/slo-support
          if-no-files-found: error
          retention-days: 30
