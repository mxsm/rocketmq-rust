name: RocketMQ Rust CI

permissions:
  contents: read

# Always publish the existing required contexts; select work inside the workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CI: true
  CARGO_PROFILE_DEV_DEBUG: "false"
  CARGO_PROFILE_TEST_DEBUG: "false"
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "false"
  # ===== RocksDB / build cache =====
  CARGO_TARGET_DIR: target
  ROCKSDB_DISABLE_JEMALLOC: 1


jobs:
  request-header-codec-contract:
    needs: check
    if: needs.check.outputs.header == 'true'
    name: Request Header Codec Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Check complete request-header typed registry
        run: cargo test --locked -p rocketmq-protocol --test request_header_codec_registry

  error-architecture:
    needs: check
    if: needs.check.outputs.errors == 'true'
    name: Error Architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check error architecture
        run: python scripts/error_architecture_guard.py

  # =========================
  # Maintained architecture checks
  # =========================
  architecture-guards:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Architecture Guards (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Test architecture guards
        run: python scripts/run_architecture_tests.py --tier pr_static

      - name: Check package dependency boundaries
        run: python scripts/architecture_dependency_guard.py --scope core-release

      - name: Check generated architecture documentation
        run: python scripts/architecture_documentation_guard.py --mode semantic --scope core-release

      - name: Check production environment writes
        run: python scripts/environment_write_guard.py

      - name: Check Rust hygiene
        run: python scripts/rust_hygiene_guard.py --scope core-release

      - name: Check generated metric catalog
        run: python scripts/generate_metric_catalog.py --check

      - name: Check telemetry semantic registry
        run: python scripts/telemetry_semantic_guard.py --scope core-release

  architecture-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Architecture Contracts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install contract test dependencies
        run: python -m pip install PyYAML

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Test release and fixture contracts
        run: python scripts/run_architecture_tests.py --tier phase_contract --tier dynamic_fixture

  # =========================
  # Format + Clippy + Shear
  # =========================
  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      full_features: ${{ steps.scope.outputs.full_features }}
      observability: ${{ steps.scope.outputs.observability }}
      rocksdb: ${{ steps.scope.outputs.rocksdb }}
      header: ${{ steps.scope.outputs.header }}
      errors: ${{ steps.scope.outputs.errors }}
      nextest: ${{ steps.scope.outputs.nextest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select checks from changed paths
        id: scope
        run: python scripts/ci_scope.py

      - name: Test CI scope selection
        if: steps.scope.outputs.routing == 'true'
        run: python -m unittest discover -s scripts/tests -p test_ci_scope.py -v

      - name: Check AGENTS routing
        if: steps.scope.outputs.routing == 'true'
        run: bash ./scripts/check-agents-routing.sh

      - name: Test automatic approval decisions
        if: steps.scope.outputs.automation == 'true'
        run: node --test scripts/tests/test_auto_approve.cjs

      - name: Install system dependencies (Ubuntu)
        if: steps.scope.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev \
            cmake make ninja-build pkg-config \
            protobuf-compiler \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

          # Use llvm-config to find libclang path
          if command -v llvm-config >/dev/null 2>&1; then
            LIBCLANG_PATH=$(llvm-config --libdir)
            echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
            echo "Found libclang using llvm-config at: $LIBCLANG_PATH"
          else
            # Fallback: Search for llvm-config with version suffix
            LLVM_CONFIG=$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LLVM_CONFIG" ]; then
              LIBCLANG_PATH=$($LLVM_CONFIG --libdir)
              echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
              echo "Found libclang using $LLVM_CONFIG at: $LIBCLANG_PATH"
            else
              # Last resort: search manually
              for path in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib; do
                if [ -f "$path/libclang.so" ] || ls "$path"/libclang.so.* >/dev/null 2>&1; then
                  echo "LIBCLANG_PATH=$path" >> $GITHUB_ENV
                  echo "Found libclang at: $path (manual search)"
                  break
                fi
              done
            fi
          fi

      - name: Use repository Rust 1.95 toolchain
        if: steps.scope.outputs.rust == 'true'
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Cache Rust + RocksDB
        if: steps.scope.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rocketmq-rust-ubuntu
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            LLVM_PREFIX
            DYLD_FALLBACK_LIBRARY_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Format check
        if: steps.scope.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      - name: Clippy workspace
        if: steps.scope.outputs.rust == 'true'
        env:
          FULL_FEATURES: ${{ github.event_name != 'pull_request' || steps.scope.outputs.full_features == 'true' }}
        run: |
          if [ "$FULL_FEATURES" = true ]; then
            cargo clippy --workspace --no-deps --all-targets --all-features -- -D warnings
          else
            cargo clippy --workspace --no-deps --all-targets -- -D warnings
          fi

      - name: Document workspace public API
        if: steps.scope.outputs.rust == 'true' && github.event_name != 'pull_request'
        run: cargo doc --workspace --no-deps --all-features

  # =========================
  # Observability feature matrix
  # =========================
  observability-feature-matrix:
    needs: check
    if: needs.check.outputs.observability == 'true'
    name: Observability Features (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "observability"
          - "otlp-metrics"
          - "otel-metrics,prometheus"
          - "otlp-traces"
          - "otlp-logs"
          - "otlp-metrics,otlp-traces,otlp-logs,prometheus"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use repository Rust 1.95 toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy

      - name: Normalize observability cache key
        id: observability-cache-key
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ -z "$FEATURES" ]; then
            echo "value=default" >> "$GITHUB_OUTPUT"
          else
            echo "value=${FEATURES//,/-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: observability-features-${{ steps.observability-cache-key.outputs.value }}
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Clippy observability feature set
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ -n "$FEATURES" ]; then
            cargo clippy -p rocketmq-observability --no-deps --all-targets --features "$FEATURES" -- -D warnings
          else
            cargo clippy -p rocketmq-observability --no-deps --all-targets -- -D warnings
          fi

      - name: Test rocketmq-observability feature set
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ -n "$FEATURES" ]; then
            cargo test -p rocketmq-observability --features "$FEATURES"
          else
            cargo test -p rocketmq-observability
          fi

  # =========================
  # RocksDB feature validation
  # =========================
  rocksdb-store:
    needs: check
    if: needs.check.outputs.rocksdb == 'true'
    name: RocksDB Store Feature (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev \
            cmake make ninja-build pkg-config \
            protobuf-compiler \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev

          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake ninja protoc llvm -y
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=C:\Program Files\LLVM\bin"

      - name: Use repository Rust 1.95 toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rocksdb-store-${{ matrix.os }}
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Clippy rocksdb store
        run: cargo clippy -p rocketmq-store --features rocksdb_store --all-targets -- -D warnings

      - name: Clippy rocksdb broker
        run: cargo clippy -p rocketmq-broker --features rocksdb_store --all-targets -- -D warnings

      - name: Test rocksdb store foundation
        run: cargo test -p rocketmq-store --features rocksdb_store --test rocksdb_foundation_tests

      - name: Test rocksdb store semantics
        run: cargo test -p rocketmq-store --features rocksdb_store --test rocksdb_store_semantics_tests

      - name: Test rocksdb broker metadata and Pop
        run: |
          cargo test -p rocketmq-broker --features rocksdb_store rocksdb
          cargo test -p rocketmq-broker --features rocksdb_store pop_consumer

  # =========================
  # Build + Test
  # =========================
  build-test:
    name: Build & Test (ubuntu-latest)
    needs: check
    if: needs.check.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---------- Ubuntu ----------
      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev \
            cmake make ninja-build pkg-config \
            protobuf-compiler \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

          # Use llvm-config to find libclang path
          if command -v llvm-config >/dev/null 2>&1; then
            LIBCLANG_PATH=$(llvm-config --libdir)
            echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
            echo "Found libclang using llvm-config at: $LIBCLANG_PATH"
          else
            # Fallback: Search for llvm-config with version suffix
            LLVM_CONFIG=$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LLVM_CONFIG" ]; then
              LIBCLANG_PATH=$($LLVM_CONFIG --libdir)
              echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
              echo "Found libclang using $LLVM_CONFIG at: $LIBCLANG_PATH"
            else
              # Last resort: search manually
              for path in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib; do
                if [ -f "$path/libclang.so" ] || ls "$path"/libclang.so.* >/dev/null 2>&1; then
                  echo "LIBCLANG_PATH=$path" >> $GITHUB_ENV
                  echo "Found libclang at: $path (manual search)"
                  break
                fi
              done
            fi
          fi

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rocketmq-rust-ubuntu-latest
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            LLVM_PREFIX
            DYLD_FALLBACK_LIBRARY_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Test workspace
        env:
          FULL_FEATURES: ${{ github.event_name != 'pull_request' || needs.check.outputs.full_features == 'true' }}
        run: |
          if [ "$FULL_FEATURES" = true ]; then
            cargo test --workspace --all-features
          else
            cargo test --workspace
          fi

  # =========================
  # cargo-nextest pilot (Linux only, non-blocking)
  # =========================
  nextest-pilot:
    name: Nextest Pilot (ubuntu-latest)
    needs: check
    if: needs.check.outputs.nextest == 'true'
    runs-on: ubuntu-latest
    # Evaluation only: Build & Test stays the required test path.
    continue-on-error: true
    env:
      NEXTEST_VERSION: 0.9.146
      PILOT_RUNS: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev \
            cmake make ninja-build pkg-config \
            protobuf-compiler \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

          {
            echo "CC=clang"
            echo "CXX=clang++"
            echo "LIBCLANG_PATH=$(llvm-config --libdir)"
          } >> "$GITHUB_ENV"

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rocketmq-rust-nextest-pilot
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Select feature set
        env:
          FULL_FEATURES: ${{ github.event_name != 'pull_request' || needs.check.outputs.full_features == 'true' }}
        run: |
          # Same selection as Build & Test.
          if [ "$FULL_FEATURES" = true ]; then
            echo "CARGO_FEATURE_ARGS=--all-features" >> "$GITHUB_ENV"
          else
            echo "CARGO_FEATURE_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: Install cargo-nextest
        run: |
          start=$(date +%s)
          curl -LsSf "https://get.nexte.st/${NEXTEST_VERSION}/linux" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version
          echo "NEXTEST_INSTALL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Build test targets
        run: |
          start=$(date +%s)
          # nextest reuses these artifacts; doctests are compiled when they run.
          cargo test --workspace --locked ${CARGO_FEATURE_ARGS:+"$CARGO_FEATURE_ARGS"} --no-run
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Test pilot reconciliation
        run: python3 -m unittest discover -s scripts/tests -p test_nextest_pilot_compare.py -v

      - name: Compare cargo test with cargo nextest
        env:
          # Results are parsed from the logs below.
          CARGO_TERM_COLOR: never
        run: |
          mkdir -p target/nextest-pilot
          logs=target/nextest-pilot
          # Also kept in the job log and the uploaded artifact, so results stay readable without the UI.
          summary_file="$logs/summary.md"
          : > "$summary_file"
          trap 'cat "$summary_file"; cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"' EXIT
          seconds() {
            local start status
            start=$(date +%s.%N)
            "$@"; status=$?
            LAST_SECONDS=$(awk -v a="$start" -v b="$(date +%s.%N)" 'BEGIN { printf "%.1f", b - a }')
            return $status
          }
          run_cargo() {
            seconds cargo test --workspace --locked ${CARGO_FEATURE_ARGS:+"$CARGO_FEATURE_ARGS"} --no-fail-fast \
              > "$logs/cargo-test-$1.log" 2>&1 && cargo_status=0 || cargo_status=$?
            cargo_s=$LAST_SECONDS
          }
          run_nextest() {
            seconds cargo nextest run --workspace --locked ${CARGO_FEATURE_ARGS:+"$CARGO_FEATURE_ARGS"} --profile ci \
              > "$logs/nextest-$1.log" 2>&1 && nextest_status=0 || nextest_status=$?
            nextest_s=$LAST_SECONDS
            # A round that writes no report is then reported as missing, not as the previous round's.
            cp target/nextest/ci/junit.xml "$logs/junit-$1.xml" || true
            rm -f target/nextest/ci/junit.xml
            seconds cargo test --workspace --locked ${CARGO_FEATURE_ARGS:+"$CARGO_FEATURE_ARGS"} --doc --no-fail-fast \
              > "$logs/doc-$1.log" 2>&1 && doc_status=0 || doc_status=$?
            doc_s=$LAST_SECONDS
          }

          # Maps cargo test binary paths to nextest binary IDs so failures can be compared by identity.
          cargo nextest list --workspace --locked ${CARGO_FEATURE_ARGS:+"$CARGO_FEATURE_ARGS"} \
            --message-format json > "$logs/nextest-list.json"
          rm -f target/nextest/ci/junit.xml

          # Untimed warm-up: tests that invoke Cargo themselves (trybuild, feature-closure checks)
          # are much slower on a cold target/tests cache, which would favor whichever runner goes second.
          seconds cargo test --workspace --locked ${CARGO_FEATURE_ARGS:+"$CARGO_FEATURE_ARGS"} --no-fail-fast \
            > "$logs/warm-up.log" 2>&1 || true
          warm_up_s=$LAST_SECONDS

          {
            echo "### cargo-nextest pilot"
            echo
            echo "nextest ${NEXTEST_VERSION} on $(nproc) vCPU, $(free -g | awk '/^Mem:/ {print $2}') GiB RAM;" \
              "features: \`${CARGO_FEATURE_ARGS:-default}\`; nextest install ${NEXTEST_INSTALL_SECONDS}s;" \
              "shared test build ${BUILD_SECONDS}s; untimed warm-up ${warm_up_s}s"
            echo
            echo "| Run | First | cargo test (s) | nextest (s) | cargo test --doc (s) | nextest + doc (s) | Exit codes (cargo / nextest / doc) |"
            echo "| --- | --- | ---: | ---: | ---: | ---: | --- |"
          } >> "$summary_file"
          # Alternate which runner goes first so neither consistently benefits from the other's caches.
          for run in $(seq 1 "$PILOT_RUNS"); do
            if [ $(( run % 2 )) -eq 1 ]; then first="cargo test"; run_cargo "$run"; run_nextest "$run"
            else first="nextest"; run_nextest "$run"; run_cargo "$run"; fi
            printf '| %s | %s | %.0f | %.0f | %.0f | %.0f | %s / %s / %s |\n' "$run" "$first" "$cargo_s" "$nextest_s" \
              "$doc_s" "$(awk -v a="$nextest_s" -v b="$doc_s" 'BEGIN { print a + b }')" \
              "$cargo_status" "$nextest_status" "$doc_status" >> "$summary_file"
          done

          # Every round is reconciled: tests run, ignored tests, doctests, and the identities of failed
          # tests and doctests. Failures shared by both runners are left to Build & Test.
          echo >> "$summary_file"
          python3 scripts/nextest_pilot_compare.py --logs "$logs" --runs "$PILOT_RUNS" >> "$summary_file" || {
            echo "::error::cargo test and cargo nextest diverged; see the reconciliation table"
            exit 1
          }

      - name: Upload nextest pilot logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-pilot-logs
          path: target/nextest-pilot/
          retention-days: 14

  interface-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Store, Producer, Tiered, and Loom contracts
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          clang llvm libclang-dev cmake make ninja-build pkg-config
          protobuf-compiler libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Store capability interfaces
        run: >-
          cargo test -p rocketmq-store
          --test capability_conformance_tests
          --test public_api_contract

      - name: Producer capability interfaces
        run: >-
          cargo test -p rocketmq-client-rust
          --test client_capability_boundaries
          --test public_api_exports_test

      - name: Tiered provider and lifecycle interfaces
        run: cargo test -p rocketmq-tieredstore --lib --tests

      - name: Quick Loom contracts
        run: |
          cargo test -p rocketmq-runtime \
            --test arc_mut_replacement_loom \
            --test resource_budget_loom \
            --test task_group_shutdown_loom
          cargo test -p rocketmq-store-local --test mapped_write_lease_loom

  # =========================
  # Coverage (Ubuntu only)
  # =========================
  coverage:
    name: Code Coverage
    needs: check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev \
            cmake make ninja-build pkg-config \
            protobuf-compiler \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

          # Use llvm-config to find libclang path
          if command -v llvm-config >/dev/null 2>&1; then
            LIBCLANG_PATH=$(llvm-config --libdir)
            echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
            echo "Found libclang using llvm-config at: $LIBCLANG_PATH"
          else
            # Fallback: Search for llvm-config with version suffix
            LLVM_CONFIG=$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LLVM_CONFIG" ]; then
              LIBCLANG_PATH=$($LLVM_CONFIG --libdir)
              echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
              echo "Found libclang using $LLVM_CONFIG at: $LIBCLANG_PATH"
            else
              # Last resort: search manually
              for path in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib; do
                if [ -f "$path/libclang.so" ] || ls "$path"/libclang.so.* >/dev/null 2>&1; then
                  echo "LIBCLANG_PATH=$path" >> $GITHUB_ENV
                  echo "Found libclang at: $path (manual search)"
                  break
                fi
              done
            fi
          fi

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rocketmq-rust-coverage
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            LLVM_PREFIX
            DYLD_FALLBACK_LIBRARY_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage (all features)
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
  build-windows:
    name: Build & Test (windows-latest)
    needs: check
    if: needs.check.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---------- Windows ----------
      - name: Install system dependencies (Windows)
        run: |
          choco install cmake ninja protoc -y

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rocketmq-rust-windows-latest
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            LLVM_PREFIX
            DYLD_FALLBACK_LIBRARY_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Build (all features)
        run: cargo build --workspace --all-features

  build-macos:
    name: Build & Test (macos-latest)
    needs: check
    if: needs.check.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---------- macOS ----------
      - name: Install system dependencies (macOS)
        run: |
          brew update
          brew install cmake protobuf snappy lz4 zstd llvm

          # Set up LLVM paths for bindgen on macOS
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=$LLVM_PREFIX/lib" >> $GITHUB_ENV
          echo "DYLD_FALLBACK_LIBRARY_PATH=$LLVM_PREFIX/lib:$DYLD_FALLBACK_LIBRARY_PATH" >> $GITHUB_ENV
          echo "PATH=$LLVM_PREFIX/bin:$PATH" >> $GITHUB_ENV
          echo "Configured LLVM at: $LLVM_PREFIX"

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rocketmq-rust-macos-latest
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            LLVM_PREFIX
            DYLD_FALLBACK_LIBRARY_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Build (all features)
        run: cargo build --workspace --all-features
