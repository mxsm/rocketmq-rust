name: RocketMQ Rust CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'rocketmq-doc/**'
      - 'rocketmq-website/**'
      - 'docker/**'
      - 'resources/**'
      - 'distribution/**'
      - 'rocketmq-dashboard/rocketmq-dashboard-gpui/**'
      - 'rocketmq-dashboard/rocketmq-dashboard-tauri/**'
      - 'rocketmq-dashboard/rocketmq-dashboard-web/**'
      - 'rocketmq-dashboard/README*.md'
      - 'rocketmq-example/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'rocketmq-doc/**'
      - 'rocketmq-website/**'
      - 'docker/**'
      - 'resources/**'
      - 'distribution/**'
      - 'rocketmq-dashboard/rocketmq-dashboard-gpui/**'
      - 'rocketmq-dashboard/rocketmq-dashboard-tauri/**'
      - 'rocketmq-dashboard/rocketmq-dashboard-web/**'
      - 'rocketmq-dashboard/README*.md'
      - 'rocketmq-example/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CI: true
  CARGO_PROFILE_DEV_DEBUG: "false"
  CARGO_PROFILE_TEST_DEBUG: "false"
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "false"
  # ===== RocksDB / build cache =====
  CARGO_TARGET_DIR: target
  ROCKSDB_DISABLE_JEMALLOC: 1

jobs:
  error-architecture:
    name: Error Architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check error architecture
        run: python scripts/error_architecture_guard.py

  # =========================
  # Architecture migration guards
  # =========================
  architecture-guards:
    name: Architecture Guards (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Test architecture guards
        run: python -m unittest discover -s scripts/tests -p "test_*guard.py" -v

      - name: Check dependency policy fixtures
        run: python scripts/architecture_dependency_guard.py --fixtures

      - name: Check dependency baseline
        run: python scripts/architecture_dependency_guard.py --mode baseline

      - name: Check dependency transition
        run: python scripts/architecture_dependency_guard.py --mode transition

      - name: Check architecture release package
        run: python scripts/architecture_release_guard.py

      - name: Check generated architecture documentation
        run: python scripts/architecture_documentation_guard.py --check

      - name: Check production environment writes
        run: python scripts/environment_write_guard.py

      - name: Check Rust hygiene
        run: python scripts/rust_hygiene_guard.py

      - name: Check Trait policy inventory
        run: python scripts/trait_policy_guard.py

      - name: Check architecture performance profiles
        run: python scripts/architecture_performance_guard.py --validate-profiles

      - name: Check telemetry semantic registry
        run: python scripts/telemetry_semantic_guard.py

      - name: Check shared-mutation fixtures
        run: python scripts/arc_mut_guard.py --fixtures

      - name: Check shared-mutation baseline
        run: python scripts/arc_mut_guard.py

      - name: Check stable nightly surface baseline
        run: python scripts/stable_surface_guard.py --mode baseline

  architecture-target:
    name: Architecture Strict Target
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Run strict target and retain the debt report
        id: strict-target
        run: python scripts/architecture_dependency_guard.py --mode target --output target/architecture-dependency-target.json

      - name: Publish strict target summary
        if: always()
        shell: bash
        run: |
          echo "### Strict architecture target" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ steps.strict-target.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The P2 target debt ledger is empty; this job is enforced." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload strict target report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: architecture-dependency-target
          path: target/architecture-dependency-target.json
          if-no-files-found: error

  # =========================
  # Format + Clippy + Shear
  # =========================
  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev \
            cmake make ninja-build pkg-config \
            protobuf-compiler \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

          # Use llvm-config to find libclang path
          if command -v llvm-config >/dev/null 2>&1; then
            LIBCLANG_PATH=$(llvm-config --libdir)
            echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
            echo "Found libclang using llvm-config at: $LIBCLANG_PATH"
          else
            # Fallback: Search for llvm-config with version suffix
            LLVM_CONFIG=$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LLVM_CONFIG" ]; then
              LIBCLANG_PATH=$($LLVM_CONFIG --libdir)
              echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
              echo "Found libclang using $LLVM_CONFIG at: $LIBCLANG_PATH"
            else
              # Last resort: search manually
              for path in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib; do
                if [ -f "$path/libclang.so" ] || ls "$path"/libclang.so.* >/dev/null 2>&1; then
                  echo "LIBCLANG_PATH=$path" >> $GITHUB_ENV
                  echo "Found libclang at: $path (manual search)"
                  break
                fi
              done
            fi
          fi

      - name: Use repository Rust 1.95 toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rocketmq-rust-ubuntu
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            LLVM_PREFIX
            DYLD_FALLBACK_LIBRARY_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check AGENTS routing
        run: bash ./scripts/check-agents-routing.sh

      - name: Check rocketmq-mcp
        run: cargo check -p rocketmq-mcp

      - name: Test rocketmq-mcp
        run: cargo test -p rocketmq-mcp

      - name: Test rocketmq-mcp all features
        run: cargo test -p rocketmq-mcp --all-features

      - name: Clippy rocketmq-mcp
        run: cargo clippy --all-targets -p rocketmq-mcp --features streamable-http -- -D warnings

      - name: Document rocketmq-mcp
        run: cargo doc -p rocketmq-mcp --no-deps

      - name: Clippy (all features)
        run: cargo clippy --workspace --no-deps --all-targets --all-features -- -D warnings

      - name: Document workspace public API
        run: cargo doc --workspace --no-deps --all-features

  # =========================
  # Observability feature matrix
  # =========================
  observability-feature-matrix:
    name: Observability Features (${{ matrix.features || 'default' }})
    needs: check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "observability"
          - "otlp-metrics"
          - "otel-metrics,prometheus"
          - "otlp-traces"
          - "otlp-logs"
          - "otlp-metrics,otlp-traces,otlp-logs,prometheus"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev \
            cmake make ninja-build pkg-config \
            protobuf-compiler \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Use repository Rust 1.95 toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: observability-features-${{ matrix.features || 'default' }}
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Check observability feature set
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ -n "$FEATURES" ]; then
            cargo check --workspace --all-targets --features "$FEATURES"
          else
            cargo check --workspace --all-targets
          fi

      - name: Clippy observability feature set
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ -n "$FEATURES" ]; then
            cargo clippy --workspace --no-deps --all-targets --features "$FEATURES" -- -D warnings
          else
            cargo clippy --workspace --no-deps --all-targets -- -D warnings
          fi

      - name: Test rocketmq-observability feature set
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ -n "$FEATURES" ]; then
            cargo test -p rocketmq-observability --features "$FEATURES"
          else
            cargo test -p rocketmq-observability
          fi

  # =========================
  # RocksDB feature validation
  # =========================
  rocksdb-store:
    name: RocksDB Store Feature (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev \
            cmake make ninja-build pkg-config \
            protobuf-compiler \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev

          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake ninja protoc llvm -y
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=C:\Program Files\LLVM\bin"

      - name: Use repository Rust 1.95 toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rocksdb-store-${{ matrix.os }}
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Clippy rocksdb store
        run: cargo clippy -p rocketmq-store --features rocksdb_store --all-targets -- -D warnings

      - name: Clippy rocksdb broker
        run: cargo clippy -p rocketmq-broker --features rocksdb_store --all-targets -- -D warnings

      - name: Test rocksdb store foundation
        run: cargo test -p rocketmq-store --features rocksdb_store --test rocksdb_foundation_tests

      - name: Test rocksdb store semantics
        run: cargo test -p rocketmq-store --features rocksdb_store --test rocksdb_store_semantics_tests

      - name: Test rocksdb broker metadata and Pop
        run: |
          cargo test -p rocketmq-broker --features rocksdb_store rocksdb
          cargo test -p rocketmq-broker --features rocksdb_store pop_consumer

  # =========================
  # Build + Test
  # =========================
  build-test:
    name: Build & Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---------- Ubuntu ----------
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev \
            cmake make ninja-build pkg-config \
            protobuf-compiler \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

          # Use llvm-config to find libclang path
          if command -v llvm-config >/dev/null 2>&1; then
            LIBCLANG_PATH=$(llvm-config --libdir)
            echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
            echo "Found libclang using llvm-config at: $LIBCLANG_PATH"
          else
            # Fallback: Search for llvm-config with version suffix
            LLVM_CONFIG=$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LLVM_CONFIG" ]; then
              LIBCLANG_PATH=$($LLVM_CONFIG --libdir)
              echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
              echo "Found libclang using $LLVM_CONFIG at: $LIBCLANG_PATH"
            else
              # Last resort: search manually
              for path in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib; do
                if [ -f "$path/libclang.so" ] || ls "$path"/libclang.so.* >/dev/null 2>&1; then
                  echo "LIBCLANG_PATH=$path" >> $GITHUB_ENV
                  echo "Found libclang at: $path (manual search)"
                  break
                fi
              done
            fi
          fi

      # ---------- macOS ----------
      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake protobuf snappy lz4 zstd llvm

          # Set up LLVM paths for bindgen on macOS
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=$LLVM_PREFIX/lib" >> $GITHUB_ENV
          echo "DYLD_FALLBACK_LIBRARY_PATH=$LLVM_PREFIX/lib:$DYLD_FALLBACK_LIBRARY_PATH" >> $GITHUB_ENV
          echo "PATH=$LLVM_PREFIX/bin:$PATH" >> $GITHUB_ENV
          echo "Configured LLVM at: $LLVM_PREFIX"

      # ---------- Windows ----------
      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake ninja protoc -y

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rocketmq-rust-${{ matrix.os }}
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            LLVM_PREFIX
            DYLD_FALLBACK_LIBRARY_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Build (all features)
        run: cargo build --workspace --all-features

      - name: Test (all features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --all-features

  interface-contracts:
    name: Store, Producer, Tiered, and Loom contracts
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          clang llvm libclang-dev cmake make ninja-build pkg-config
          protobuf-compiler libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Store capability interfaces
        run: >-
          cargo test -p rocketmq-store
          --test capability_conformance_tests
          --test public_api_contract

      - name: Producer capability interfaces
        run: >-
          cargo test -p rocketmq-client-rust
          --test client_capability_boundaries
          --test public_api_exports_test

      - name: Tiered provider and lifecycle interfaces
        run: cargo test -p rocketmq-tieredstore --lib --tests

      - name: Quick Loom contracts
        run: |
          cargo test -p rocketmq-runtime \
            --test arc_mut_replacement_loom \
            --test resource_budget_loom \
            --test task_group_shutdown_loom
          cargo test -p rocketmq-store-local --test mapped_write_lease_loom

  # =========================
  # Coverage (Ubuntu only)
  # =========================
  coverage:
    name: Code Coverage
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev \
            cmake make ninja-build pkg-config \
            protobuf-compiler \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

          # Use llvm-config to find libclang path
          if command -v llvm-config >/dev/null 2>&1; then
            LIBCLANG_PATH=$(llvm-config --libdir)
            echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
            echo "Found libclang using llvm-config at: $LIBCLANG_PATH"
          else
            # Fallback: Search for llvm-config with version suffix
            LLVM_CONFIG=$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LLVM_CONFIG" ]; then
              LIBCLANG_PATH=$($LLVM_CONFIG --libdir)
              echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
              echo "Found libclang using $LLVM_CONFIG at: $LIBCLANG_PATH"
            else
              # Last resort: search manually
              for path in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib; do
                if [ -f "$path/libclang.so" ] || ls "$path"/libclang.so.* >/dev/null 2>&1; then
                  echo "LIBCLANG_PATH=$path" >> $GITHUB_ENV
                  echo "Found libclang at: $path (manual search)"
                  break
                fi
              done
            fi
          fi

      - name: Use repository Rust 1.95 toolchain
        run: rustup show active-toolchain

      - name: Cache Rust + RocksDB
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rocketmq-rust-coverage
          workspaces: |
            .
          env-vars: |
            CC
            CXX
            LIBCLANG_PATH
            LLVM_PREFIX
            DYLD_FALLBACK_LIBRARY_PATH
            ROCKSDB_DISABLE_JEMALLOC

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage (all features)
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
          verbose: true
