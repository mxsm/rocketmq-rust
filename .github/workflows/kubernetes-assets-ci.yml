name: Kubernetes deployment assets

on:
  pull_request:
    paths:
      - ".github/workflows/kubernetes-assets-ci.yml"
      - "distribution/helm/**"
      - "distribution/kubernetes/**"
      - "distribution/container/core-service.Dockerfile"
      - "distribution/core_helm_contract.py"
      - "docker/container-policy.json"
      - "docker/core-container-policy.json"
      - "scripts/core_container_image_guard.py"
      - "scripts/tests/test_core_container_image_guard.py"
      - "scripts/kubernetes-assets-contract.ps1"
      - "scripts/kubernetes_assets_guard.py"
      - "scripts/tests/test_m11_kubernetes_assets.py"
      - "scripts/tests/test_m11_service_lifecycle.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/kubernetes-assets-ci.yml"
      - "distribution/helm/**"
      - "distribution/kubernetes/**"
      - "distribution/container/core-service.Dockerfile"
      - "distribution/core_helm_contract.py"
      - "docker/container-policy.json"
      - "docker/core-container-policy.json"
      - "scripts/core_container_image_guard.py"
      - "scripts/tests/test_core_container_image_guard.py"
      - "scripts/kubernetes-assets-contract.ps1"
      - "scripts/kubernetes_assets_guard.py"
      - "scripts/tests/test_m11_kubernetes_assets.py"
      - "scripts/tests/test_m11_service_lifecycle.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Helm, Kustomize, and schema contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run static and deliberate-violation tests
        shell: bash
        run: |
          python scripts/kubernetes_assets_guard.py
          python -m unittest scripts.tests.test_m11_kubernetes_assets -v
          python -m unittest scripts.tests.test_m11_service_lifecycle -v

      - name: Validate canonical and overlay renders
        shell: pwsh
        run: ./scripts/kubernetes-assets-contract.ps1

      - name: Validate four-service container and chart boundary
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/target/kubernetes-tools:$PATH"
          python -m unittest scripts.tests.test_core_container_image_guard -v
          python scripts/core_container_image_guard.py --policy docker/core-container-policy.json --chart distribution/helm/rocketmq-rust-core

      - name: Upload rendered validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kubernetes-assets-${{ github.sha }}
          path: target/kubernetes-assets
          if-no-files-found: error
          retention-days: 14
