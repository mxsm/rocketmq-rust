name: Architecture documentation

on:
  workflow_dispatch:
  schedule:
    - cron: '41 20 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Generated architecture evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate architecture documentation
        run: python scripts/architecture_documentation_guard.py --check

      - name: Test documentation guard
        run: python -m unittest scripts.tests.test_architecture_documentation_guard -v
