mode = "cluster"

[grpc]
listenAddr = "0.0.0.0:38081"

[remoting]
enabled = true
listenAddr = "0.0.0.0:38080"

[cluster]
namesrvAddr = "127.0.0.1:39876"
brokerClusterName = "GpuiParityCluster"

[auth]
clusterName = "GpuiParityCluster"
authConfigPath = "/var/lib/rocketmq/proxy/auth"
