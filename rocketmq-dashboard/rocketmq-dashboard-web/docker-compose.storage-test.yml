# The CLI or CI job may override this with `docker compose -p <project>`.
# Do not add explicit network or volume names: Compose then scopes every
# resource to the selected project and parallel test runs cannot collide.
name: rocketmq-dashboard-storage-test

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rocketmq_dashboard_storage_test
      MYSQL_USER: rocketmq_storage_test
      MYSQL_PASSWORD: rocketmq_storage_test_password
      MYSQL_ROOT_PASSWORD: rocketmq_storage_test_root_password
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=rocketmq_storage_test --password=rocketmq_storage_test_password --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - storage-test
    volumes:
      - mysql-data:/var/lib/mysql

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: rocketmq_dashboard_storage_test
      POSTGRES_USER: rocketmq_storage_test
      POSTGRES_PASSWORD: rocketmq_storage_test_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host=127.0.0.1 --username=rocketmq_storage_test --dbname=rocketmq_dashboard_storage_test
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - storage-test
    volumes:
      - postgres-data:/var/lib/postgresql/data

  storage-test-runner:
    build:
      context: ../..
      dockerfile: rocketmq-dashboard/rocketmq-dashboard-web/deploy/storage-test.Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    init: true
    restart: "no"
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      ROCKETMQ_DASHBOARD_STORAGE_TEST_MYSQL_URL: mysql://rocketmq_storage_test:rocketmq_storage_test_password@mysql:3306/rocketmq_dashboard_storage_test
      ROCKETMQ_DASHBOARD_STORAGE_TEST_POSTGRES_URL: postgres://rocketmq_storage_test:rocketmq_storage_test_password@postgres:5432/rocketmq_dashboard_storage_test
      ROCKETMQ_DASHBOARD_STORAGE_TEST_SQLITE_PATH: /storage/sqlite/dashboard-storage-test.db
      ROCKETMQ_DASHBOARD_STORAGE_TEST_FILE_PATH: /storage/file
    networks:
      - storage-test
    volumes:
      - sqlite-data:/storage/sqlite
      - file-data:/storage/file

networks:
  storage-test:

volumes:
  mysql-data:
  postgres-data:
  sqlite-data:
  file-data:
