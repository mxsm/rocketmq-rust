name: rocketmq-tauri-tls-debug
x-common: &common
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/$${ROCKETMQ_HEALTH_BIND_ADDR##*:}; printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *" 200 "* ]]']
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s
services:
  namesrv:
    <<: *common
    image: rocketmq-rust/namesrv:local
    command: [--configFile, /etc/rocketmq/namesrv.toml]
    environment:
      RUST_LOG: info
      ROCKETMQ_HEALTH_BIND_ADDR: 0.0.0.0:38088
    ports:
      - "127.0.0.1:39786:9876"
      - "127.0.0.1:33911:33911"
      - "127.0.0.1:38088:38088"
      - "127.0.0.1:38090:38090"
    volumes:
      - ./namesrv.toml:/etc/rocketmq/namesrv.toml:ro
      - ./certs:/certs:ro
      - namesrv-data:/var/lib/rocketmq
  broker:
    <<: *common
    image: rocketmq-rust/broker:local
    network_mode: service:namesrv
    depends_on:
      namesrv:
        condition: service_healthy
    command: [--configFile, /etc/rocketmq/broker.toml]
    environment:
      RUST_LOG: info
      ROCKETMQ_HEALTH_BIND_ADDR: 0.0.0.0:38090
    volumes:
      - ./broker.toml:/etc/rocketmq/broker.toml:ro
      - ./certs:/certs:ro
      - broker-data:/var/lib/rocketmq
volumes:
  namesrv-data:
  broker-data:
